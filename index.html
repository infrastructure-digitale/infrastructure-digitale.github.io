/* --- Terminal simulé à missions (Bash, PowerShell, console Python) --- */
function simTerm(el, t) {
  const T = t.term; let i = 0, log = [], hint = false;
  const ps = T.lang === 'powershell';
  function out(cmd, txt, cls) { log.push({ c: cmd, t: txt, k: cls || '' }); }
  function draw() {
    const fin = i >= T.missions.length, M = T.missions[i];
    el.innerHTML = `<div class="sim"><div class="lx-top"><div class="eyebrow">${fin ? 'Toutes les missions sont réussies' : `Mission ${i + 1} sur ${T.missions.length}`}</div><div class="pw-bar tm-p"><i class="ok" style="width:${i / T.missions.length * 100}%"></i></div></div>
      ${fin ? `<div class="fb ok"><b>Bravo !</b><p>Tu as réalisé les ${T.missions.length} missions. Tu peux continuer à essayer des commandes librement, ou recommencer.</p></div>` : `<div class="note tm-goal"><b>${esc(M.g)}</b>${hint ? `<br><span class="muted">Indice : </span><code>${esc(M.ex)}</code>` : ''}</div>`}
      <div class="tm ${T.lang}"><div class="tm-log">${log.map(l => `<div><span class="tm-pr">${esc(T.prompt)}</span> ${esc(l.c)}</div>${l.t ? `<pre class="tm-o ${l.k}">${esc(l.t)}</pre>` : ''}`).join('')}</div>
      <form class="tm-in" autocomplete="off"><span class="tm-pr">${esc(T.prompt)}</span><input type="text" spellcheck="false" autocapitalize="off" aria-label="Commande"><button class="btn" type="submit">Entrée</button></form></div>
      <div class="actions">${fin ? '' : `<button class="btn alt" data-s="hint">${hint ? 'Masquer l\'indice' : 'Indice'}</button>`}<button class="btn alt" data-s="clear">Effacer l'écran</button><button class="btn alt" data-s="again">Recommencer</button></div></div>`;
    const lg = el.querySelector('.tm-log'); lg.scrollTop = lg.scrollHeight;
    const inp = el.querySelector('.tm-in input'); try { inp.focus({ preventScroll: true }); } catch (e) {}
  }
  function run(raw) {
    const cmd = raw.trim().replace(/\s+/g, ' '); if (!cmd) return;
    const M = T.missions[i];
    if (cmd === 'clear' || cmd === 'cls' || /^clear-host$/i.test(cmd)) { log = []; return; }
    if (M && M.re.test(cmd)) { out(cmd, M.o || '✓ mission réussie', 'ok'); i++; hint = false; return; }
    const f = (T.free || []).find(x => x[0].test(cmd));
    if (f) { const m = cmd.match(f[0]); out(cmd, typeof f[1] === 'function' ? f[1](m) : f[1]); return; }
    for (let k = 0; k < T.missions.length; k++) if (k !== i && T.missions[k].re.test(cmd)) { out(cmd, (T.missions[k].o || 'OK') + (k < i ? '' : '\n(bonne commande, mais ce n\'est pas encore cette mission)')); return; }
    const first = cmd.split(' ')[0];
    out(cmd, T.lang === 'python' ? `Ce n'est pas l'instruction attendue pour cette mission. Relis l'énoncé (guillemets, crochets, parenthèses).` : ps ? `Pas tout à fait. Vérifie le nom de la cmdlet (Verbe-Nom), le pipe | et les paramètres (-Count, -First…).` : `${first} : ce n'est pas la commande attendue. Vérifie les options (-l, -p, -n…) et les espaces.`, 'bad');
  }
  el.addEventListener('submit', e => { e.preventDefault(); const inp = el.querySelector('.tm-in input'); run(inp.value); draw(); });
  el.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; if (b.dataset.s === 'hint') hint = !hint; else if (b.dataset.s === 'clear') log = []; else { i = 0; log = []; hint = false; } draw(); });
  draw();
}

/* --- Exécution pas à pas d'un script (trace des variables) --- */
function simTrace(el, t) {
  const T = t.trace; let s = -1, pick = null;
  function draw() {
    const st = s >= 0 ? T.steps[s] : null, fin = s === T.steps.length - 1;
    const outs = T.steps.slice(0, s + 1).filter(x => x.o).map(x => x.o);
    const vars = st ? st.v : {};
    el.innerHTML = `<div class="sim"><div class="field"><label>Prédiction</label><p class="def">${esc(T.q.q)}</p><div class="seg">${T.q.o.map((o, k) => `<button data-s="q" data-k="${k}" aria-pressed="${pick === k}">${esc(o)}</button>`).join('')}</div></div>
      <div class="tr-grid"><div class="block"><h3>Script ${esc(T.lang)}</h3><pre class="code tr-code">${T.code.map((c, k) => `<span class="${st && st.l === k ? 'tr-on' : ''}"><i>${k + 1}</i>${esc(c)}</span>`).join('\n')}</pre></div>
      <div class="tr-side"><div class="block"><h3>Variables</h3><div class="scroll"><table class="tr-v"><tbody>${Object.keys(vars).length ? Object.keys(vars).map(k => `<tr><td><code>${esc(k)}</code></td><td>${esc(vars[k])}</td></tr>`).join('') : '<tr><td class="muted">Aucune variable pour l\'instant</td></tr>'}</tbody></table></div></div>
      <div class="block"><h3>Affichage</h3><pre class="code tr-out">${outs.length ? esc(outs.join('\n')) : ' '}</pre></div></div></div>
      <div class="note">${st ? `<b>Étape ${s + 1} / ${T.steps.length} — ligne ${st.l + 1}.</b> ${esc(st.n || '')}` : 'Clique sur « Pas suivant » pour exécuter la première ligne.'}</div>
      <div class="actions"><button class="btn alt" data-s="prev" ${s < 0 ? 'disabled' : ''}>← Pas précédent</button><button class="btn" data-s="next" ${fin ? 'disabled' : ''}>Pas suivant →</button><button class="btn alt" data-s="end">Tout exécuter</button><button class="btn alt" data-s="reset">Recommencer</button></div>
      ${fin ? `<div class="fb ${pick === T.q.a ? 'ok' : 'bad'}"><b>${pick === null ? 'Script terminé.' : pick === T.q.a ? 'Ta prédiction était juste !' : 'Ta prédiction était fausse.'}</b><p>Bonne réponse : ${esc(T.q.o[T.q.a])}.</p></div>` : ''}</div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b || b.disabled) return; const a = b.dataset.s;
    if (a === 'q') pick = +b.dataset.k; else if (a === 'next') s = Math.min(s + 1, T.steps.length - 1); else if (a === 'prev') s = Math.max(s - 1, -1); else if (a === 'end') s = T.steps.length - 1; else { s = -1; pick = null; }
    draw();
  });
  draw();
}

/* --- Constructeur de ligne crontab --- */
function simCron(el) {
  const F = [
    ['Minute', [['0', '0'], ['30', '30'], ['*/5', 'toutes les 5'], ['*/15', 'toutes les 15'], ['*', 'chaque minute']]],
    ['Heure', [['*', 'chaque heure'], ['2', '2 h'], ['7', '7 h'], ['8', '8 h'], ['23', '23 h']]],
    ['Jour du mois', [['*', 'tous'], ['1', 'le 1er'], ['15', 'le 15']]],
    ['Mois', [['*', 'tous'], ['1', 'janvier'], ['9', 'septembre']]],
    ['Jour de semaine', [['*', 'tous'], ['1-5', 'lun–ven'], ['0', 'dimanche'], ['6', 'samedi']]]
  ];
  const MIS = [['Chaque jour à 23 h 30', '30 23 * * *'], ['Du lundi au vendredi à 7 h', '0 7 * * 1-5'], ['Toutes les 5 minutes', '*/5 * * * *'], ['Le 1er de chaque mois à 8 h', '0 8 1 * *'], ['Chaque dimanche à 2 h', '0 2 * * 0'], ['Toutes les heures, à la minute 0', '0 * * * *']];
  let v = ['*', '*', '*', '*', '*'], m = 0, done = {};
  const JS = { '0': 'dimanche', '6': 'samedi', '1-5': 'du lundi au vendredi' }, MO = { '1': 'en janvier', '9': 'en septembre' };
  function phrase() {
    const [mi, h, d, mo, w] = v; let p = '';
    if (mi.startsWith('*/')) p = `Toutes les ${mi.slice(2)} minutes`; else if (mi === '*') p = 'Chaque minute';
    if (!p) p = h === '*' ? `Toutes les heures à la minute ${mi}` : `À ${h} h ${mi === '0' ? '' : mi}`.trim();
    else if (h !== '*') p += `, pendant l'heure de ${h} h`;
    p += d !== '*' ? `, le ${d === '1' ? '1er' : d} du mois` : (w === '*' ? ', tous les jours' : '');
    if (w !== '*') p += `, ${JS[w]}`;
    if (mo !== '*') p += `, ${MO[mo]}`;
    return p;
  }
  function draw() {
    const line = v.join(' '), ok = line === MIS[m][1]; if (ok) done[m] = true;
    el.innerHTML = `<div class="sim"><div class="field"><label>Mission</label><div class="seg">${MIS.map((x, k) => `<button data-s="m" data-k="${k}" aria-pressed="${m === k}">${done[k] ? '✓ ' : ''}${k + 1}</button>`).join('')}</div><p class="def">${esc(MIS[m][0])}</p></div>
      ${F.map((f, k) => `<div class="field"><label>${f[0]}</label><div class="seg">${f[1].map(o => `<button data-s="f" data-k="${k}" data-v="${o[0]}" aria-pressed="${v[k] === o[0]}"><code>${o[0]}</code> ${esc(o[1])}</button>`).join('')}</div></div>`).join('')}
      <div class="gq"><span>⏰</span><code>${esc(line)}  /home/stagiaire/scripts/sauvegarde.sh</code></div>
      <p class="muted">Traduction : ${esc(phrase())}.</p>
      <div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? 'Mission réussie.' : 'Pas encore.'}</b><p>${ok ? 'C\'est exactement la bonne ligne. Passe à la mission suivante.' : 'Ajuste les 5 champs : minute, heure, jour du mois, mois, jour de la semaine.'}</p></div>
      <p class="muted">Missions réussies : ${Object.keys(done).length} / ${MIS.length}</p></div>`;
  }
  el.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; if (b.dataset.s === 'm') { m = +b.dataset.k; v = ['*', '*', '*', '*', '*']; } else v[+b.dataset.k] = b.dataset.v; draw(); });
  draw();
}

function labTopoSVG(tp) {
  const N = {}; tp.nodes.forEach(n => { N[n.id] = n; });
  const SZ = { pc: [78, 44], sw: [100, 40], r: [100, 40], l3: [112, 44] };
  const exit = (n, ux, uy) => { const s = SZ[n.t], ex = Math.abs(ux) < 1e-6 ? 1e9 : s[0] / 2 / Math.abs(ux), ey = Math.abs(uy) < 1e-6 ? 1e9 : s[1] / 2 / Math.abs(uy); return Math.min(ex, ey); };
  let lines = '', labs = '', nodes = ''; const oc = {}; tp.links.forEach(l => { oc[l.a] = (oc[l.a] || 0) + 1; });
  tp.links.forEach(l => {
    const a = N[l.a], b = N[l.b], dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
    lines += `<line class="lk v${l.c}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    const put = (n, txt, sx) => {
      if (!txt) return;
      const lw = txt.length * 6.4; let d = exit(n, sx * ux, sx * uy) + 8 + Math.abs(ux) * lw / 2 + Math.abs(uy) * 7; if (sx === 1 && oc[n.id] >= 4) d = len * 0.42;
      labs += `<text class="pt" x="${(n.x + sx * ux * d).toFixed(1)}" y="${(n.y + sx * uy * d + 4).toFixed(1)}" text-anchor="middle">${esc(txt)}</text>`;
    };
    put(a, l.pa, 1); put(b, l.pb, -1);
    if (l.lab) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      labs += Math.abs(ux) > Math.abs(uy)
        ? `<text class="tl" x="${mx}" y="${my - 10}" text-anchor="middle">${esc(l.lab)}</text>`
        : `<text class="tl" x="${mx + 12}" y="${my + 4}">${esc(l.lab)}</text>`;
    }
  });
  tp.nodes.forEach(n => {
    const s = SZ[n.t], v = n.v ? ' v' + n.v : '';
    nodes += `<g class="nd ${n.t}${v}"><rect x="${n.x - s[0] / 2}" y="${n.y - s[1] / 2}" width="${s[0]}" height="${s[1]}" rx="${n.t === 'pc' ? 6 : 10}"/>
      <text class="nm" x="${n.x}" y="${n.y - 2}" text-anchor="middle">${esc(n.l)}</text><text class="sb" x="${n.x}" y="${n.y + 13}" text-anchor="middle">${esc(n.s || '')}</text></g>`;
  });
  return `<svg class="labmap" viewBox="0 0 640 ${tp.h}" role="img" aria-label="Topologie du lab">${lines}${nodes}${labs}</svg>`;
}

}
function tableHTML(tb) {

function themeHTML() {

  } else if (S.tab === 'sim') {

  } else if (S.tab === 'lab' && t.lab && t.lab.sheet) {

  }

function quizHTML() {
  const z = S.quiz, q = z.qs[z.i], n = z.qs.length, ans = z.sel !== null;

function resultHTML() {
  const z = S.quiz, n = z.qs.length, p = z.score / n;
  const msg = p >= .9 ? "Excellent. Les notions sont acquises." : p >= .7 ? "Bien. Revoyez les points ratés ci-dessous." : p >= .5 ? "À consolider. Relisez la fiche, testez la simulation, puis refaites le quiz." : "À reprendre. Relisez la fiche et manipulez la simulation avant de réessayer.";
  let h = `<div class="stack"><div class="eyebrow">${esc(z.title)}</div><p class="score">${z.score}<small> / ${n}</small></p><p class="def">${msg}</p>
    <div class="actions"><button class="btn" data-a="retry">Refaire le quiz</button><button class="btn alt" data-a="quit">${z.key.charAt(0) === 't' ? 'Retour à la leçon' : "Retour à l'accueil"}</button></div>`;

function prep(q) { const o = shuffle(q.o); return { q: q.q, o, ci: o.indexOf(q.o[0]), e: q.e }; }

  go('quiz');
}
function startChapter(c) {
  if (CHAPQ[c]) return startQuiz(CHAPQ[c], 'QCM du chapitre · ' + CHAPS[c], 'c' + c);
  let all = []; inChap(c).forEach(t => { all = all.concat(t.q); });

function startGeneral(n) {

  const M = modOf(S.mod); let all = []; THEMES.filter(t => M.chaps.indexOf(t.ch) >= 0).forEach(t => { all = all.concat(t.q); });
  startQuiz(shuffle(all).slice(0, n), 'QCM · ' + M.menu + ' · ' + Math.min(n, all.length) + ' questions', (S.mod === 'm103' ? 'gen' : 'gen-' + S.mod) + '-' + n);
}
function render() {
  if (S.view === 'theme') { const m = modOfChap(theme(S.tid).ch); if (m.id !== S.mod) { S.mod = m.id; store.set('cmt-mod', m.id); } }
  topnav.innerHTML = navHTML();
  if (S.view === 'home') app.innerHTML = homeHTML();
  else if (S.view === 'theme') {
    app.innerHTML = themeHTML();
    if (S.tab === 'sim') { const t = theme(S.tid); SIMS[t.sim](document.getElementById('sim'), t); }
  }
  else if (S.view === 'quiz') app.innerHTML = quizHTML();
  else if (S.view === 'lab') app.innerHTML = labHTML();

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, z = S.quiz;
  if (a === 'home') go('home');
  else if (a === 'open') go('theme', +b.dataset.id, 'cours');
  else if (a === 'tab') go('theme', null, b.dataset.t);
  else if (a === 'startTheme') { const t = theme(S.tid); startQuiz(t.q, t.t, 't' + t.id); }
  else if (a === 'chapter') startChapter(+b.dataset.c);
  else if (a === 'general') startGeneral(+b.dataset.n || 20);
  else if (a === 'lab') { const X = LABS.filter(x => x.id === +b.dataset.id)[0]; if (X && !X.locked) { S.lab = X.id; go('lab'); } }

    z.i++; z.sel = null;
    if (z.i >= z.qs.length) { saveBest(z.key, z.score, z.qs.length); go('result'); } else render();
  }
  else if (a === 'retry') {
    if (z.key.slice(0, 3) === 'gen') startGeneral();
    else if (z.key.charAt(0) === 'c') startChapter(+z.key.slice(1));
    else { const t = theme(S.tid); startQuiz(t.q, z.title, z.key); }
  }
  else if (a === 'labfault') { S.labPreset = { f: b.dataset.f, src: b.dataset.src, dst: b.dataset.dst, sel: b.dataset.sel }; go('theme', null, 'sim'); }
  else if (a === 'corr') { const c = b.closest('.block').querySelector('.lx-corr'); c.hidden = !c.hidden; b.setAttribute('aria-expanded', String(!c.hidden)); b.textContent = c.hidden ? 'Afficher le corrigé' : 'Masquer le corrigé'; }
  else if (a === 'copycfg') {
    const txt = theme(S.tid).lab.sheet.configs[+b.dataset.i].text, pre = b.closest('.lx-cfg').querySelector('pre');
    const done = () => { b.textContent = 'Copié'; setTimeout(() => { b.textContent = 'Copier'; }, 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Texte sélectionné'; };
    try { navigator.clipboard.writeText(txt).then(done, sel); } catch (err) { sel(); }
  }
  else if (a === 'quit') { if (z && z.key.charAt(0) === 't') go('theme', null, 'quiz'); else go('home'); }
});

/* Déverrouillage : un lab est disponible uniquement si le fichier labs/lab-N.json est présent sur le site */
LABS.forEach(l => {
  if (!l.locked) return;
  fetch('labs/lab-' + l.id + '.json', { cache: 'no-store' })

    .catch(() => {});
});
render();

if (window.__test) window.__test = { THEMES, macStep, arpSteps, domainSVG, MACS, ip6expand, ip6compress, vlsmPlan, subnetOf, macParse, macHTML, v4HTML, v6HTML, intToIp, ipToInt, topoDef, SIMS, parseIp4 };
