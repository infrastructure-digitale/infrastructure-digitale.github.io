{ id: 48, ch: 9, t: "Les principes du routage", short: "Table de routage, plus long préfixe, distance administrative", sim: 'lookup',
  def: "Router, c'est choisir par quelle interface envoyer un paquet pour qu'il se rapproche de son réseau de destination. Le routeur prend cette décision en consultant sa table de routage, ligne par ligne, pour chaque paquet.",
  pts: [
    "Un routeur relie des réseaux IP différents. Chaque interface est dans un réseau distinct, et le routeur ne transmet pas les diffusions.",
    "Pour chaque paquet, le routeur lit l'adresse IP de destination et cherche dans sa table de routage la route correspondante.",
    "Une route contient : le réseau de destination et son préfixe, la prochaine adresse (next-hop) ou l'interface de sortie, la distance administrative et la métrique.",
    "Codes de la table Cisco (`show ip route`) : `C` réseau directement connecté, `L` adresse locale de l'interface, `S` route statique, `O` OSPF, `R` RIP, `D` EIGRP, `*` route par défaut candidate.",
    "Règle du plus long préfixe : si plusieurs routes correspondent, le routeur choisit la plus précise (/24 avant /16 avant /8 avant /0).",
    "Si aucune route ne correspond et qu'il n'y a pas de route par défaut, le paquet est détruit et un message ICMP « destination inaccessible » est renvoyé.",
    "La distance administrative (AD) indique la confiance dans la source d'une route : plus elle est basse, plus la route est préférée. La métrique départage les routes d'un même protocole."
  ],
  table: { h: ["Source de la route", "Code", "Distance administrative"], r: [
    ["Directement connectée", "C", "0"],
    ["Statique", "S", "1"],
    ["EIGRP (interne)", "D", "90"],
    ["OSPF", "O", "110"],
    ["RIP", "R", "120"],
    ["Inconnue / inutilisable", "—", "255"]
  ] },
  kw: ["Table de routage", "Next-hop", "Plus long préfixe", "Distance administrative", "Métrique", "Route par défaut", "show ip route"],
  ana: "Un routeur, c'est un carrefour avec des panneaux indicateurs. Le panneau le plus précis gagne : « Fès centre » est préféré à « Fès », lui-même préféré à « Toutes directions ».",
  res: "Un routeur d'agence connaît ses deux LAN (routes C), une route statique vers le siège et une route par défaut vers Internet. Un paquet pour 8.8.8.8 ne correspond à aucun réseau connu : il part par la route par défaut.",
  piege: "Croire que le routeur prend la première ligne de la table qui correspond. Il prend la route au préfixe le plus long, quel que soit l'ordre d'affichage.",
  simIntro: "Choisis une adresse de destination : le routeur compare chaque route de sa table et retient celle qui a le préfixe le plus long.",
  q: [
    { q: "Sur quelle information le routeur base-t-il sa décision ?", o: ["L'adresse IP de destination du paquet", "L'adresse MAC source", "L'adresse IP source", "Le numéro de VLAN"], e: "Il cherche le réseau de destination dans sa table de routage." },
    { q: "Plusieurs routes correspondent à la destination. Laquelle est choisie ?", o: ["Celle qui a le préfixe le plus long", "La première de la table", "Celle qui a le préfixe le plus court", "La route par défaut"], e: "Règle du plus long préfixe : la route la plus précise." },
    { q: "Que signifie le code « C » dans show ip route ?", o: ["Réseau directement connecté", "Route Cisco", "Route copiée", "Route chiffrée"], e: "Le réseau d'une interface active du routeur." },
    { q: "Quelle est la distance administrative d'une route statique ?", o: ["1", "0", "110", "120"], e: "0 = connectée, 1 = statique, 110 = OSPF, 120 = RIP." },
    { q: "Une route OSPF (AD 110) et une route RIP (AD 120) mènent au même réseau. Laquelle est installée ?", o: ["La route OSPF", "La route RIP", "Les deux en alternance", "Aucune"], e: "La plus petite distance administrative l'emporte." },
    { q: "Que fait le routeur sans route correspondante ni route par défaut ?", o: ["Il détruit le paquet et renvoie un message ICMP", "Il diffuse le paquet sur toutes les interfaces", "Il le renvoie à l'expéditeur tel quel", "Il le garde en mémoire"], e: "Le routeur ne diffuse jamais un paquet inconnu." },
    { q: "Un routeur transmet-il les diffusions de couche 2 ?", o: ["Non, il sépare les domaines de diffusion", "Oui, sur toutes ses interfaces", "Oui, mais seulement le DHCP", "Seulement en IPv6"], e: "C'est l'une de ses différences essentielles avec le switch." }

{ id: 49, ch: 9, t: "Le routage statique", short: "ip route, next-hop, route par défaut, route flottante", sim: 'static',
  def: "Une route statique est saisie à la main par l'administrateur avec la commande `ip route`. Elle est simple et sûre, mais elle ne s'adapte pas toute seule quand le réseau change.",
  pts: [
    "Syntaxe : `ip route <réseau> <masque> <next-hop | interface de sortie> [distance]`. Exemple : `ip route 192.168.3.0 255.255.255.0 10.0.12.2`.",
    "Le next-hop doit être joignable : une adresse dans un réseau directement connecté au routeur, sinon la route n'est pas utilisable.",
    "Route par défaut : `ip route 0.0.0.0 0.0.0.0 <next-hop>`. Elle sert quand aucune route plus précise ne correspond, typiquement vers Internet.",
    "Une communication marche dans les deux sens : il faut une route pour l'aller ET une route pour le retour. L'oubli de la route retour est l'erreur numéro 1.",
    "Route statique flottante : une route de secours avec une distance administrative plus haute (ex. `ip route 0.0.0.0 0.0.0.0 10.0.99.1 200`). Elle n'est utilisée que si la route principale disparaît.",
    "Avantages : aucun calcul, pas de trafic de protocole, contrôle total, sécurité. Limites : beaucoup de saisie dans un grand réseau, aucune adaptation automatique aux pannes.",
    "Vérifier : `show ip route static`, `ping`, `traceroute`."
  ],
  table: { h: ["", "Statique", "Dynamique"], r: [
    ["Configuration", "Manuelle, route par route", "Automatique, échange entre routeurs"],
    ["Réaction à une panne", "Aucune (sauf route flottante)", "Recalcul automatique"],
    ["Ressources", "Aucune", "CPU, mémoire, bande passante"],
    ["Adapté à", "Petit réseau, route par défaut, réseau en étoile", "Réseau moyen ou grand, plusieurs chemins"]
  ] },
  kw: ["ip route", "Next-hop", "Interface de sortie", "Route par défaut", "0.0.0.0/0", "Route flottante", "Route retour"],
  ana: "Une route statique, c'est un itinéraire écrit sur papier : parfait tant que la route est ouverte. Si un pont s'effondre, le papier ne change pas tout seul : il faut le réécrire, ou avoir prévu un itinéraire de secours (route flottante).",
  res: "Une agence avec un seul lien vers le siège n'a besoin que d'une route par défaut vers le siège. Inutile d'y faire tourner un protocole de routage.",
  piege: "Configurer la route aller sur R1 et oublier la route retour sur R3 : le ping part, arrive, mais la réponse ne revient jamais. On croit que le réseau est coupé alors qu'il manque une seule ligne.",
  simIntro: "Coche les routes statiques à configurer sur chaque routeur, puis lance un ping : la trace montre le chemin aller, le chemin retour et l'endroit exact où le paquet est perdu.",
  q: [
    { q: "Quelle commande crée une route statique vers 192.168.3.0/24 via 10.0.12.2 ?", o: ["ip route 192.168.3.0 255.255.255.0 10.0.12.2", "route add 192.168.3.0 10.0.12.2", "ip static 192.168.3.0/24 10.0.12.2", "router static 192.168.3.0"], e: "Réseau, masque, puis next-hop." },
    { q: "Comment écrit-on une route par défaut ?", o: ["ip route 0.0.0.0 0.0.0.0 <next-hop>", "ip route 255.255.255.255 0.0.0.0 <next-hop>", "ip default-route any", "ip route default"], e: "0.0.0.0/0 correspond à toutes les destinations." },
    { q: "Le ping de PC1 vers PC3 échoue alors que R1 a une route vers le LAN de PC3. Cause la plus probable ?", o: ["La route retour vers le LAN de PC1 manque sur un routeur", "Le switch de PC1 est mal configuré", "La route aller est trop précise", "Le ping ne traverse pas les routeurs"], e: "La réponse doit aussi trouver son chemin." },
    { q: "Qu'est-ce qu'une route statique flottante ?", o: ["Une route de secours avec une distance administrative plus élevée", "Une route qui change de next-hop toutes les minutes", "Une route sans masque", "Une route apprise par OSPF"], e: "Elle n'entre dans la table que si la route principale disparaît." },
    { q: "Quel est le principal inconvénient du routage statique ?", o: ["Il ne s'adapte pas automatiquement aux pannes", "Il consomme beaucoup de bande passante", "Il est impossible à sécuriser", "Il ne fonctionne qu'en IPv6"], e: "Chaque changement demande une intervention manuelle." },
    { q: "Quel next-hop est valide pour une route statique sur R1 ?", o: ["Une adresse dans un réseau directement connecté à R1", "N'importe quelle adresse du réseau", "L'adresse du PC destination", "L'adresse MAC du routeur voisin"], e: "R1 doit pouvoir joindre ce next-hop directement." },
    { q: "Quelle commande affiche seulement les routes statiques ?", o: ["show ip route static", "show static", "show running-config ospf", "show ip interface brief"], e: "Les routes statiques apparaissent avec le code S." }
  ] },

{ id: 50, ch: 9, t: "Le routage dynamique", short: "RIP, OSPF, EIGRP, BGP, vecteur de distance, état de liens", sim: 'dyn',
  def: "Avec le routage dynamique, les routeurs échangent automatiquement les réseaux qu'ils connaissent grâce à un protocole de routage. Ils construisent seuls leur table et la recalculent quand un lien tombe.",
  pts: [
    "IGP (à l'intérieur d'une organisation) : RIP, OSPF, EIGRP, IS-IS. EGP (entre organisations, sur Internet) : BGP.",
    "Vecteur de distance (RIP) : chaque routeur annonce ses routes à ses voisins, comme une rumeur. Il ne connaît pas toute la topologie.",
    "État de liens (OSPF) : chaque routeur reçoit la carte complète du réseau et calcule lui-même le meilleur chemin (algorithme SPF de Dijkstra).",
    "RIP : métrique = nombre de sauts, maximum 15 (16 = inaccessible). Simple, mais ignore la vitesse des liens et converge lentement.",
    "OSPF : métrique = coût, calculé à partir de la bande passante (coût = bande passante de référence ÷ débit du lien). Rapide, standard, adapté aux réseaux d'entreprise.",
    "EIGRP : protocole avancé d'origine Cisco (bande passante et délai). BGP : le protocole qui relie les opérateurs d'Internet.",
    "Convergence : le temps qu'il faut aux routeurs pour se mettre d'accord après un changement. Plus elle est rapide, moins la coupure dure."
  ],
  table: { h: ["Protocole", "Type", "Métrique", "AD", "Usage"], r: [
    ["RIPv2", "Vecteur de distance", "Nombre de sauts (max 15)", "120", "Petits réseaux, labo"],
    ["OSPF", "État de liens", "Coût (bande passante)", "110", "Entreprise, standard ouvert"],
    ["EIGRP", "Vecteur de distance avancé", "Bande passante + délai", "90", "Réseaux Cisco"],
    ["BGP", "Vecteur de chemin", "Attributs de chemin", "20 (externe)", "Internet, opérateurs"]
  ] },
  kw: ["Routage dynamique", "IGP", "EGP", "Vecteur de distance", "État de liens", "RIP", "OSPF", "EIGRP", "BGP", "Convergence"],
  ana: "RIP compte les villes traversées ; OSPF regarde la carte et le type de route. Pour aller de Fès à Casablanca, RIP préfère la petite route qui traverse moins de villes, OSPF préfère l'autoroute, même si elle passe par plus de villes.",
  res: "Une entreprise relie 12 sites avec des liens de vitesses différentes. Avec OSPF, quand une liaison fibre tombe, le trafic bascule automatiquement sur le lien de secours en quelques secondes, sans intervention.",
  piege: "Penser que le chemin avec le moins de sauts est toujours le meilleur. Un lien lent sur 1 saut peut être bien pire que 3 sauts en fibre : c'est exactement la faiblesse de RIP.",
  simIntro: "Choisis le type de routage, puis coupe des liens : observe le chemin choisi par la route statique, par RIP (moins de sauts) et par OSPF (plus petit coût).",
  q: [
    { q: "Quelle métrique utilise RIP ?", o: ["Le nombre de sauts", "La bande passante", "Le délai", "La charge du CPU"], e: "Maximum 15 sauts ; 16 = réseau inaccessible." },
    { q: "Quelle métrique utilise OSPF ?", o: ["Le coût, basé sur la bande passante", "Le nombre de sauts", "L'adresse MAC", "Le numéro de VLAN"], e: "Coût = bande passante de référence ÷ débit du lien." },
    { q: "OSPF est un protocole…", o: ["À état de liens", "À vecteur de distance", "Extérieur (EGP)", "Propriétaire de niveau 2"], e: "Chaque routeur connaît toute la topologie de sa zone." },
    { q: "Quel protocole relie les opérateurs entre eux sur Internet ?", o: ["BGP", "RIP", "OSPF", "STP"], e: "BGP est le protocole extérieur (EGP) d'Internet." },
    { q: "Qu'est-ce que la convergence ?", o: ["Le temps pour que tous les routeurs aient une vue cohérente après un changement", "La fusion de deux VLAN", "Le passage d'IPv4 à IPv6", "Le chiffrement des routes"], e: "Pendant la convergence, une partie du trafic peut être perdue." },
    { q: "Pour un réseau RIP, combien de sauts maximum un réseau peut-il être éloigné ?", o: ["15", "255", "16", "100"], e: "À 16, il est considéré comme inaccessible." },
    { q: "Pourquoi RIP peut-il choisir un mauvais chemin ?", o: ["Il ignore la vitesse des liens", "Il ne connaît pas les adresses IP", "Il n'envoie aucune mise à jour", "Il ne fonctionne que sur fibre"], e: "Un lien lent en 1 saut l'emporte sur 3 liens rapides." }
  ] },

    { s: "Quelle commande permet de vérifier que R1 voit bien ses voisins OSPF ?", o: ["show ip route", "show ip ospf neighbor", "show vlan brief", "show cdp interface"], a: 1, e: "Un voisin en état FULL échange complètement ses informations." },
    { s: "Avec la bande passante de référence par défaut (100 Mbit/s), quel est le coût OSPF d'un lien de 10 Mbit/s ?", o: ["1", "100", "10", "1000"], a: 2, e: "100 ÷ 10 = 10. Un lien FastEthernet (100 Mbit/s) a un coût de 1." },
    { s: "Un lien de 1 Gbit/s et un lien de 100 Mbit/s ont le même coût OSPF (1). Comment corriger ?", o: ["Changer le router-id", "Passer en RIP", "auto-cost reference-bandwidth 10000 sur tous les routeurs", "Ajouter une route statique"], a: 2, e: "On augmente la bande passante de référence (en Mbit/s), de façon identique sur tous les routeurs." }
  ],
  def: "OSPF (Open Shortest Path First) est le protocole de routage dynamique standard des réseaux d'entreprise. Dans une conception simple, tous les routeurs sont dans une seule zone, la zone 0 (backbone).",
  pts: [
    "Activer OSPF : `router ospf 1` (1 = numéro de processus local), puis `router-id 1.1.1.1` pour identifier le routeur de façon unique.",
    "Annoncer les réseaux : `network <adresse> <wildcard> area 0`. Exemple : `network 192.168.1.0 0.0.0.255 area 0`. Le wildcard est l'inverse du masque.",
    "Les routeurs échangent des Hello pour découvrir leurs voisins, puis leurs bases de données de liens, et calculent les meilleurs chemins avec l'algorithme SPF.",
    "Pour devenir voisins : même zone, même sous-réseau, mêmes timers Hello / Dead, même type d'authentification.",
    "Coût d'un lien = bande passante de référence (100 Mbit/s par défaut) ÷ débit. 10 Mbit/s → 10, 100 Mbit/s et plus → 1 (d'où `auto-cost reference-bandwidth`).",
    "`passive-interface` : on annonce le réseau du LAN sans y envoyer de Hello (sécurité et propreté).",
    "Vérifications : `show ip ospf neighbor`, `show ip route ospf`, `show ip protocols`."
  ],
  table: { h: ["Commande", "Rôle"], r: [
    ["router ospf 1", "Démarre le processus OSPF n° 1"],
    ["router-id 1.1.1.1", "Fixe l'identifiant unique du routeur"],
    ["network 10.0.12.0 0.0.0.3 area 0", "Active OSPF sur les interfaces de ce réseau, zone 0"],
    ["passive-interface g0/0", "Pas de Hello vers le LAN, réseau annoncé quand même"],
    ["auto-cost reference-bandwidth 10000", "Référence à 10 Gbit/s pour distinguer les liens rapides"],
    ["show ip ospf neighbor", "Liste les voisins et leur état (FULL)"]
  ] },
  kw: ["OSPF", "Zone 0", "router-id", "network … area 0", "Wildcard", "Hello", "Voisin FULL", "Coût", "passive-interface"],
  ana: "OSPF, c'est un groupe de livreurs qui partagent tous la même carte de la ville. Chacun calcule son trajet le plus rapide, et dès qu'une rue est fermée, l'information circule et chacun recalcule.",
  res: "Trois routeurs en triangle avec OSPF : quand le lien direct R1–R3 tombe, R1 passe automatiquement par R2 en quelques secondes. Les utilisateurs remarquent à peine la coupure.",
  piege: "Se tromper de wildcard dans la commande network (mettre le masque 255.255.255.0 au lieu de 0.0.0.255). L'interface n'est pas activée dans OSPF et le réseau n'est jamais annoncé.",
  simIntro: "Résous ces situations de configuration et de dépannage OSPF : zone, réseaux annoncés, interface passive, coût.",
  q: [
    { q: "Quelle commande annonce le réseau 192.168.1.0/24 dans la zone 0 ?", o: ["network 192.168.1.0 0.0.0.255 area 0", "network 192.168.1.0 255.255.255.0 area 0", "ospf network 192.168.1.0/24", "ip ospf 192.168.1.0 area 0"], e: "OSPF utilise un wildcard dans la commande network." },
    { q: "Comment s'appelle la zone principale d'OSPF ?", o: ["La zone 0 (backbone)", "La zone 1", "La zone par défaut 100", "La zone native"], e: "Dans une conception simple, tous les routeurs sont en zone 0." },
    { q: "À quoi servent les paquets Hello ?", o: ["Découvrir et maintenir les voisins OSPF", "Attribuer des adresses IP", "Chiffrer les routes", "Tester la vitesse du lien"], e: "Ils sont envoyés régulièrement sur les interfaces OSPF actives." },
    { q: "Quel est le coût OSPF par défaut d'un lien à 100 Mbit/s ?", o: ["1", "10", "100", "0"], e: "100 ÷ 100 = 1." },
    { q: "Que fait passive-interface sur l'interface LAN ?", o: ["Annonce le réseau sans envoyer de Hello sur cette interface", "Désactive l'interface", "Supprime le réseau d'OSPF", "Change le coût à 0"], e: "Aucun voisin n'est recherché côté utilisateurs." },
    { q: "Quel état indique que deux voisins OSPF ont fini de synchroniser leurs informations ?", o: ["FULL", "DOWN", "INIT", "BLOCKING"], e: "show ip ospf neighbor affiche FULL." },
    { q: "Quelle condition est nécessaire pour que deux routeurs deviennent voisins OSPF ?", o: ["Être dans la même zone et le même sous-réseau", "Avoir le même router-id", "Avoir le même nom d'hôte", "Être du même modèle"], e: "Le router-id, au contraire, doit être unique." }
  ] }

/* ---------- Module « Automatiser les tâches d'administration » (leçons 52 à 60) ---------- */
const AUTO_PDF = 'docs/automatisation-administration.pdf';
THEMES.push(
{ id: 52, ch: 10, pdf: AUTO_PDF, web: 'automatisation.html#ch2', t: "Le terminal Bash : commandes et redirections", short: "Chemins, commandes, pipes, grep, permissions", sim: 'term',
  term: { prompt: 'stagiaire@srv-web:~$', lang: 'bash', missions: [
    { g: "Affiche le dossier dans lequel tu te trouves.", re: /^pwd$/, o: "/home/stagiaire", ex: "pwd" },
    { g: "Liste le contenu du dossier avec les détails (droits, taille, date).", re: /^ls\s+-(l|la|al|lh|lah|alh)$/, o: "drwxr-xr-x 2 stagiaire stagiaire 4096 nov 13 09:12 backup\n-rw-r--r-- 1 stagiaire stagiaire  220 nov 13 09:40 journal.log\n-rw-r--r-- 1 stagiaire stagiaire  812 nov 13 10:02 sauvegarde.sh\ndrwxr-xr-x 3 stagiaire stagiaire 4096 nov 12 18:20 site", ex: "ls -l" },
    { g: "Crée le dossier backup/2026/novembre en une seule commande.", re: /^mkdir\s+-p\s+(\.\/)?backup\/2026\/novembre\/?$/, o: "", ex: "mkdir -p backup/2026/novembre" },
    { g: "Affiche les 5 dernières lignes de /var/log/syslog.", re: /^tail\s+(-n\s*5|-5)\s+\/var\/log\/syslog$/, o: "Nov 13 10:01 srv-web systemd[1]: Started Daily apt download activities.\nNov 13 10:02 srv-web CRON[2210]: (stagiaire) CMD (/home/stagiaire/sauvegarde.sh)\nNov 13 10:05 srv-web sshd[2231]: Accepted publickey for stagiaire\nNov 13 10:07 srv-web kernel: [UFW BLOCK] IN=eth0 SRC=41.250.12.7\nNov 13 10:09 srv-web systemd[1]: nginx.service: Reloaded.", ex: "tail -n 5 /var/log/syslog" },
    { g: "Compte les lignes qui contiennent « Failed password » dans /var/log/auth.log.", re: /^(grep\s+-c\s+(["'])Failed password\2\s+\/var\/log\/auth\.log|grep\s+(["'])Failed password\3\s+\/var\/log\/auth\.log\s*\|\s*wc\s+-l)$/, o: "17", ex: "grep -c \"Failed password\" /var/log/auth.log" },
    { g: "Ajoute la ligne « Sauvegarde OK » à la fin de journal.log (sans effacer le contenu).", re: /^echo\s+(["'])Sauvegarde OK\1\s*>>\s*journal\.log$/, o: "", ex: "echo \"Sauvegarde OK\" >> journal.log" },
    { g: "Rends le script sauvegarde.sh exécutable.", re: /^chmod\s+(\+x|u\+x|a\+x|7[0-7][0-7])\s+sauvegarde\.sh$/, o: "", ex: "chmod +x sauvegarde.sh" }
  ], free: [
    [/^ls$/, "backup  journal.log  sauvegarde.sh  site"], [/^whoami$/, "stagiaire"], [/^hostname$/, "srv-web"], [/^date$/, "ven. 13 nov. 2026 10:12:41 CET"],
    [/^cat\s+journal\.log$/, "2026-11-12 23:30 OK\n2026-11-13 09:40 OK"], [/^echo\s+(.*)$/, m => m[1].replace(/^["']|["']$/g, '')], [/^ls\s+-a$/, ".  ..  .bashrc  backup  journal.log  sauvegarde.sh  site"]
  ] },
  def: "Bash est le shell par défaut de Linux : il interprète les commandes tapées au clavier ou écrites dans un script. Une commande s'écrit `commande -options arguments`, et on combine les commandes avec des redirections et des pipes.",
  pts: [
    "Chemin absolu (commence par `/`) ou relatif (part du dossier courant). `.` = dossier courant, `..` = parent, `~` = dossier personnel.",
    "Commandes de base : `pwd`, `ls -la`, `cd`, `mkdir -p`, `touch`, `cp -r`, `mv`, `rm`, `cat`, `head`, `tail -f`, `echo`, `man`.",
    "Redirections : `>` écrit (écrase), `>>` ajoute, `2>` redirige les erreurs, `<` lit depuis un fichier.",
    "Le pipe `|` envoie la sortie d'une commande à la suivante : `cat access.log | grep 404 | wc -l`.",
    "Filtrer : `grep` (motif), `wc -l` (compter), `sort`, `uniq -c`, `cut -d: -f1`, `find`.",
    "Permissions rwx pour propriétaire / groupe / autres : r=4, w=2, x=1. `chmod 750 script.sh`, `chmod +x script.sh`.",
    "`rm -rf` supprime sans corbeille ni confirmation : toujours relire avant Entrée."
  ],
  table: { h: ["Symbole", "Effet", "Exemple"], r: [
    [">", "Écrit dans un fichier (écrase)", "ls /etc > liste.txt"],
    [">>", "Ajoute à la fin", "echo OK >> journal.log"],
    ["2>", "Redirige les erreurs", "find / -name x 2> /dev/null"],
    ["|", "Enchaîne deux commandes", "cat /etc/passwd | wc -l"]
  ] },
  kw: ["Bash", "Chemin absolu", "Redirection", "Pipe", "grep", "chmod", "rm -rf", "sudo"],
  ana: "Le pipe, c'est une chaîne de montage : chaque ouvrier (commande) fait une seule chose et passe la pièce au suivant.",
  res: "Pour repérer une attaque par force brute sur un serveur, l'administrateur compte en une ligne les échecs SSH : `grep -c \"Failed password\" /var/log/auth.log`.",
  piege: "Confondre `>` et `>>`. `echo OK > journal.log` efface tout l'historique du journal ; `>>` ajoute à la fin.",
  simIntro: "Un terminal Linux simulé : tape la commande qui réalise chaque mission, puis Entrée. Le bouton Indice montre une réponse possible.",
  q: [
    { q: "Quelle commande affiche le dossier courant ?", o: ["pwd", "cd", "ls", "whoami"], e: "Print Working Directory." },
    { q: "Que fait `>>` ?", o: ["Ajoute la sortie à la fin d'un fichier", "Écrase le fichier", "Redirige les erreurs", "Compare deux nombres"], e: "`>` écrase, `>>` ajoute." },
    { q: "Que vaut `rwxr-x---` en chiffres ?", o: ["750", "755", "640", "777"], e: "rwx = 7, r-x = 5, --- = 0." },
    { q: "À quoi sert le symbole `|` ?", o: ["Envoyer la sortie d'une commande à la suivante", "Écrire dans un fichier", "Commenter une ligne", "Lancer en arrière-plan"], e: "C'est le pipe." },
    { q: "Quelle commande crée un dossier et tous ses parents ?", o: ["mkdir -p", "mkdir -r", "touch -p", "cd -p"], e: "-p crée les dossiers intermédiaires s'ils manquent." },
    { q: "Quel chemin est absolu ?", o: ["/var/log/syslog", "logs/syslog", "../syslog", "./syslog"], e: "Il commence par la racine /." }
  ] },

{ id: 53, ch: 10, pdf: AUTO_PDF, web: 'automatisation.html#ch3', t: "Scripts Bash : variables, conditions, boucles", short: "Shebang, $1, if, for, while, fonctions", sim: 'trace',
  trace: { lang: 'Bash', code: ['total=0', 'for n in 2 4 6; do', '  total=$(( total + n ))', '  echo "Après $n : $total"', 'done', 'if [ $total -ge 10 ]; then', '  echo "Grand total : $total"', 'fi'],
    steps: [
      { l: 0, v: { total: '0' }, n: "On crée la variable total, valeur 0. Pas d'espace autour du = !" },
      { l: 1, v: { total: '0', n: '2' }, n: "Premier tour de boucle : n prend la première valeur de la liste, 2." },
      { l: 2, v: { total: '2', n: '2' }, n: "$(( )) fait un calcul : 0 + 2 = 2." },
      { l: 3, v: { total: '2', n: '2' }, o: 'Après 2 : 2', n: "echo affiche le texte, les variables sont remplacées par leur valeur." },
      { l: 1, v: { total: '2', n: '4' }, n: "Deuxième tour : n vaut 4." },
      { l: 2, v: { total: '6', n: '4' }, n: "2 + 4 = 6." },
      { l: 3, v: { total: '6', n: '4' }, o: 'Après 4 : 6' },
      { l: 1, v: { total: '6', n: '6' }, n: "Troisième et dernier tour : n vaut 6." },
      { l: 2, v: { total: '12', n: '6' }, n: "6 + 6 = 12." },
      { l: 3, v: { total: '12', n: '6' }, o: 'Après 6 : 12' },
      { l: 4, v: { total: '12', n: '6' }, n: "La liste est épuisée : on sort de la boucle." },
      { l: 5, v: { total: '12', n: '6' }, n: "Test : 12 -ge 10 (supérieur ou égal) est VRAI, on entre dans le if." },
      { l: 6, v: { total: '12', n: '6' }, o: 'Grand total : 12' },
      { l: 7, v: { total: '12', n: '6' }, n: "fi ferme le if. Fin du script." }
    ],
    q: { q: "Avant de lancer : que va afficher la dernière ligne ?", o: ["Grand total : 12", "Grand total : 6", "Rien, la condition est fausse", "Grand total : 10"], a: 0 } },
  def: "Un script Bash est un fichier texte qui commence par le shebang `#!/bin/bash` et enchaîne des commandes avec des variables, des conditions et des boucles. On le rend exécutable avec `chmod +x` et on le lance avec `./script.sh`.",
  pts: [
    "Variable : `nom=\"SW1\"` (aucun espace autour du =), utilisée avec `\"$nom\"`. Résultat d'une commande : `$(hostname)`. Calcul : `$(( a + b ))`.",
    "Arguments : `$1`, `$2`… ; `$#` = nombre d'arguments ; `$0` = nom du script ; `$?` = code de retour de la dernière commande (0 = succès).",
    "Condition : `if [ \"$x\" -ge 10 ]; then … elif … else … fi`. Espaces obligatoires dans les crochets.",
    "Tests : nombres `-eq -ne -gt -ge -lt -le`, texte `= != -z -n`, fichiers `-f -d -x`.",
    "Boucles : `for i in liste; do … done`, `for i in {1..20}`, `while read -r ligne; do … done < fichier`.",
    "Fonction : `journal() { echo \"$(date) $1\" >> log; }`. `return 0` / `exit 1` pour les codes de retour.",
    "`cmd1 && cmd2` : cmd2 si cmd1 réussit ; `cmd1 || cmd2` : cmd2 si cmd1 échoue."
  ],
  table: { h: ["Variable", "Contenu"], r: [["$0", "Nom du script"], ["$1, $2…", "Arguments"], ["$#", "Nombre d'arguments"], ["$?", "Code de retour (0 = succès)"], ["$(cmd)", "Résultat d'une commande"]] },
  kw: ["Shebang", "Variable", "$1 / $#", "if / test", "for / while", "Fonction", "Code de retour"],
  ana: "Un script Bash, c'est l'historique de tes commandes qui a appris à réfléchir : il sait répéter (boucle) et choisir (condition).",
  res: "Un script de 10 lignes pingue chaque matin les 20 adresses des serveurs de l'école et écrit dans un journal ceux qui ne répondent pas.",
  piege: "`nom = \"admin\"` avec des espaces : Bash croit que `nom` est une commande et affiche « commande introuvable ». Même piège avec `[\"$a\" -eq 1]` sans espaces dans les crochets.",
  simIntro: "Réponds d'abord à la question de prédiction, puis exécute le script pas à pas : la ligne active, les variables et l'affichage évoluent à chaque étape.",
  q: [
    { q: "Quelle est la première ligne d'un script Bash ?", o: ["#!/bin/bash", "//bash", "<bash>", "import bash"], e: "Le shebang indique l'interpréteur." },
    { q: "Quelle affectation est correcte ?", o: ["nom=\"srv\"", "nom = \"srv\"", "$nom=\"srv\"", "set nom \"srv\""], e: "Pas d'espace autour du =, pas de $ à l'affectation." },
    { q: "Que contient `$#` ?", o: ["Le nombre d'arguments", "Le nom du script", "Le code de retour", "Le premier argument"], e: "$1 est le premier argument, $0 le nom du script." },
    { q: "Un code de retour de 0 signifie…", o: ["Succès", "Erreur", "Aucun résultat", "Script interrompu"], e: "Tout autre nombre signale une erreur." },
    { q: "Comment tester « supérieur ou égal » entre deux nombres ?", o: ["-ge", ">=", "-gt", "=>"], e: "-gt = strictement supérieur." },
    { q: "Comment parcourir les nombres 1 à 20 ?", o: ["for i in {1..20}; do … done", "for (i=1 to 20)", "loop 1-20", "foreach i in 1..20"], e: "Accolades et deux points." }
  ] },

{ id: 54, ch: 10, pdf: AUTO_PDF, web: 'automatisation.html#ch3', t: "Bash : scripts d'administration et cron", short: "Sauvegarde, comptes, surveillance, planification", sim: 'cron',
  def: "Les scripts d'administration Bash automatisent les tâches répétitives d'un serveur Linux : sauvegardes, comptes, surveillance. Le service cron les exécute ensuite automatiquement à heure fixe.",
  pts: [
    "Sauvegarde : `tar -czf archive-$(date +%F).tar.gz /var/www`, journal avec la date, rotation avec `find … -mtime +7 -delete`.",
    "Comptes en masse : lire un fichier avec `while IFS=: read -r login groupe`, tester l'existence avec `id`, créer avec `useradd -m -g`.",
    "Surveillance : espace disque (`df`), services (`systemctl is-active`), ping des serveurs, alerte dans un journal.",
    "Robustesse : vérifier les arguments, `set -euo pipefail`, guillemets autour des variables, codes de retour.",
    "cron : 5 champs `minute heure jour-du-mois mois jour-de-semaine` puis la commande. `crontab -e` pour modifier, `crontab -l` pour lister.",
    "Dans cron, toujours des chemins absolus, et rediriger la sortie : `>> /chemin/cron.log 2>&1`."
  ],
  table: { h: ["Ligne crontab", "Signification"], r: [
    ["0 * * * *", "Toutes les heures"], ["*/5 * * * *", "Toutes les 5 minutes"], ["30 2 * * 1-5", "Du lundi au vendredi à 2 h 30"], ["0 23 * * 0", "Le dimanche à 23 h"], ["0 8 1 * *", "Le 1er du mois à 8 h"]
  ] },
  kw: ["tar", "Rotation", "useradd", "Idempotence", "cron", "crontab -e", "Chemin absolu"],
  ana: "cron, c'est le réveil du serveur : on règle l'heure une fois, et chaque jour il déclenche la même tâche sans qu'on y pense.",
  res: "Chaque soir à 23 h 30, cron lance la sauvegarde du site de l'école ; le script garde 7 jours d'archives et écrit OK ou ERREUR dans un journal relu chaque matin.",
  piege: "Un script qui marche dans le terminal mais pas dans cron : cron n'a pas le même environnement. Il faut des chemins absolus et rediriger la sortie pour voir les erreurs.",
  simIntro: "Construis la ligne crontab qui correspond à chaque mission en choisissant la valeur de chaque champ.",
  q: [
    { q: "Que signifie la ligne cron « 0 2 * * * » ?", o: ["Chaque jour à 2 h", "Toutes les 2 minutes", "Le 2 de chaque mois", "Toutes les 2 heures"], e: "Minute 0, heure 2, tous les jours." },
    { q: "Quelle commande modifie la table cron de l'utilisateur ?", o: ["crontab -e", "cron --edit", "nano /etc/cron", "systemctl cron"], e: "crontab -l pour lister." },
    { q: "Que fait `find /backup -name \"*.tar.gz\" -mtime +7 -delete` ?", o: ["Supprime les archives de plus de 7 jours", "Crée 7 archives", "Compresse les fichiers", "Liste les archives récentes"], e: "C'est la rotation des sauvegardes." },
    { q: "Pourquoi tester `id \"$login\"` avant `useradd` ?", o: ["Pour ne pas recréer un compte existant (idempotence)", "Pour chiffrer le mot de passe", "Pour créer le groupe", "C'est obligatoire pour useradd"], e: "On peut relancer le script sans erreur." },
    { q: "Pourquoi utiliser des chemins absolus dans cron ?", o: ["cron n'a pas le même environnement que le terminal", "Les chemins relatifs sont interdits sous Linux", "Pour aller plus vite", "Pour chiffrer la commande"], e: "Son dossier courant et son PATH sont réduits." },
    { q: "« */5 * * * * » signifie…", o: ["Toutes les 5 minutes", "À 5 h", "Le 5 du mois", "5 fois par jour"], e: "*/5 = tous les multiples de 5 dans le champ minute." }
  ] },

{ id: 55, ch: 11, pdf: AUTO_PDF, web: 'automatisation.html#ch4', t: "PowerShell : cmdlets et pipeline objet", short: "Verbe-Nom, Get-Help, Get-Member, Where-Object", sim: 'term',

    { g: "Affiche tous les services de la machine.", re: /^get-service$/i, o: "Status   Name               DisplayName\n------   ----               -----------\nRunning  Dhcp               Client DHCP\nStopped  Spooler            Spouleur d'impression\nRunning  W32Time            Temps Windows\nStopped  wuauserv           Windows Update\n…", ex: "Get-Service" },
    { g: "Affiche seulement les services arrêtés.", re: /^get-service\s*\|\s*(where-object|where|\?)\s*(\{\s*\$_\.status\s+-eq\s+(["'])stopped\3\s*\}|(-property\s+)?status\s+-eq\s+(["']?)stopped\5)$/i, o: "Status   Name               DisplayName\n------   ----               -----------\nStopped  Spooler            Spouleur d'impression\nStopped  wuauserv           Windows Update", ex: "Get-Service | Where-Object Status -eq 'Stopped'" },
    { g: "Trouve toutes les commandes dont le nom contient « Service ».", re: /^get-command\s+(-name\s+)?\*service\*$/i, o: "CommandType  Name\n-----------  ----\nCmdlet       Get-Service\nCmdlet       New-Service\nCmdlet       Restart-Service\nCmdlet       Start-Service\nCmdlet       Stop-Service\n…", ex: "Get-Command *Service*" },
    { g: "Teste si l'hôte 192.168.1.10 répond, en envoyant 2 paquets.", re: /^test-connection\s+(-computername\s+|-targetname\s+)?192\.168\.1\.10\s+-count\s+2$/i, o: "Source   Destination    IPV4Address    Bytes  Time(ms)\n------   -----------    -----------    -----  --------\nPC-ADM   192.168.1.10   192.168.1.10   32     1\nPC-ADM   192.168.1.10   192.168.1.10   32     1", ex: "Test-Connection 192.168.1.10 -Count 2" },

  def: "PowerShell est le shell et le langage de script de Windows. Ses commandes, les cmdlets, suivent la forme Verbe-Nom et renvoient des objets avec des propriétés, que le pipeline transmet d'une commande à l'autre.",
  pts: [

    "Trouver de l'aide : `Get-Command *mot*` (quelle commande ?), `Get-Help cmdlet -Examples` (comment ?), `Get-Member` (que contient l'objet ?).",

  ] },
  kw: ["Cmdlet", "Verbe-Nom", "Get-Help", "Get-Command", "Get-Member", "Pipeline objet", "Where-Object", "$_"],

{ id: 56, ch: 11, pdf: AUTO_PDF, web: 'automatisation.html#ch5', t: "Scripts PowerShell : conditions, boucles, fonctions", short: "if, switch, foreach, param, try/catch", sim: 'trace',

  def: "Un script PowerShell (.ps1) combine des cmdlets avec des variables (`$nom`), des conditions (`if`, `switch`), des boucles (`foreach`, `for`, `while`), des fonctions avec paramètres et une gestion d'erreurs `try / catch`.",
  pts: [
    "Variables : `$serveur = \"SRV-AD01\"`, tableau `@(\"a\",\"b\")`, table de hachage `@{ Nom = \"Alaoui\"; Service = \"RH\" }`.",
    "Guillemets doubles : les variables sont remplacées (`\"Bonjour $nom\"`) ; guillemets simples : texte brut. `$( )` évalue une expression dans une chaîne.",
    "`if (…) { } elseif (…) { } else { }` et `switch ($x) { \"a\" { … } default { … } }`.",
    "`foreach ($s in $liste) { }`, `for ($i = 1; $i -le 5; $i++) { }`, `while (…) { }`.",
    "Fonction : `function Test-Port { param([Parameter(Mandatory)][string]$Hote, [int]$Port = 443) … }`.",
    "Erreurs : `try { … -ErrorAction Stop } catch { $_.Exception.Message } finally { }`. Sans `-ErrorAction Stop`, le catch ne s'exécute pas toujours.",
    "Objets de sortie propres : `[PSCustomObject]@{ Hote = $h; Ouvert = $ok }`, puis `Export-Csv`."
  ],
  table: { h: ["Élément", "Syntaxe"], r: [["Condition", "if ($x -gt 5) { … } else { … }"], ["Boucle", "foreach ($i in $liste) { … }"], ["Fonction", "function Nom { param($a) … }"], ["Erreur", "try { … } catch { … }"]] },
  kw: ["Variable $", "@( ) / @{ }", "if / switch", "foreach", "function / param", "try / catch", "PSCustomObject"],
  ana: "Un script PowerShell, c'est une procédure d'entreprise écrite pour un employé infatigable : « pour chaque service de la liste, s'il est arrêté, redémarre-le et note-le ».",
  res: "Un script de surveillance tourne toutes les heures sur les serveurs : il redémarre automatiquement les services critiques arrêtés et écrit l'événement dans un journal.",
  piege: "Oublier `-ErrorAction Stop` dans un `try` : l'erreur s'affiche en rouge, mais le bloc `catch` (et donc le journal d'erreur) n'est jamais exécuté.",
  simIntro: "Prédis le résultat, puis exécute le script pas à pas : observe la ligne active, les variables et l'affichage.",
  q: [
    { q: "Comment crée-t-on un tableau en PowerShell ?", o: ["@(\"a\", \"b\")", "[\"a\", \"b\"]", "{\"a\", \"b\"}", "(a; b)"], e: "@{ } crée une table de hachage." },
    { q: "Quelle boucle parcourt chaque élément d'une liste ?", o: ["foreach ($x in $liste) { }", "for x in liste:", "loop $liste", "repeat $liste"], e: "for avec compteur, while avec condition." },
    { q: "Que fait `$compteur++` ?", o: ["Ajoute 1 à la variable", "Double la variable", "Affiche la variable", "Remet à zéro"], e: "Équivaut à $compteur = $compteur + 1." },
    { q: "Pourquoi ajouter `-ErrorAction Stop` dans un try ?", o: ["Pour que l'erreur déclenche le bloc catch", "Pour masquer l'erreur", "Pour accélérer la cmdlet", "Pour relancer la commande"], e: "Beaucoup d'erreurs sont non bloquantes par défaut." },
    { q: "Quelle chaîne remplace la variable par sa valeur ?", o: ["\"Bonjour $nom\"", "'Bonjour $nom'", "`Bonjour $nom`", "Bonjour + $nom"], e: "Les guillemets simples gardent le texte brut." },
    { q: "Où déclare-t-on les paramètres d'une fonction ?", o: ["Dans un bloc param( )", "Dans le nom de la fonction", "Dans $args uniquement", "Dans un fichier séparé"], e: "Avec type et valeur par défaut possibles." }
  ] },

{ id: 39, ch: 8, pdf: SECU_PDF, web: 'securite.html#ch1', t: "Les fondamentaux de la sécurité", short: "Triade CIA, actif, menace, vulnérabilité, risque", sim: 'risk',

{ id: 41, ch: 8, pdf: SECU_PDF, web: 'securite.html#ch3', t: "Authentification et contrôle d'accès", short: "Mots de passe, MFA, moindre privilège, AAA", sim: 'pwd',

{ id: 42, ch: 8, pdf: SECU_PDF, web: 'securite.html#ch4', t: "Les bases de la cryptographie", short: "Symétrique, asymétrique, hachage, certificats, HTTPS", sim: 'hash',
  def: "La cryptographie protège les données : le chiffrement rend un message illisible sans la clé (confidentialité), le hachage produit une empreinte qui révèle toute modification (intégrité), la signature prouve l'auteur.",
  pts: [
    "Symétrique : une seule clé pour chiffrer et déchiffrer. Rapide. Exemple : AES. Problème : partager la clé en sécurité.",
    "Asymétrique : une clé publique (pour chiffrer, connue de tous) et une clé privée (pour déchiffrer, gardée secrète). Lent. Exemples : RSA, ECC.",
    "Chiffrement hybride (HTTPS, SSH, VPN) : l'asymétrique échange une clé de session, puis AES chiffre les données.",
    "Hachage : empreinte de taille fixe, à sens unique. Un seul caractère change → empreinte totalement différente. SHA-256 est sûr ; MD5 et SHA-1 sont cassés.",
    "Signature : on hache le message puis on chiffre l'empreinte avec sa clé privée. Le destinataire vérifie avec la clé publique.",
    "Certificat X.509 : associe une clé publique à une identité, signé par une autorité de certification (AC). L'ensemble forme une PKI.",

{ id: 46, ch: 8, pdf: SECU_PDF, web: 'securite.html#ch8', t: "Protéger les postes et les données", short: "Mises à jour, antivirus, sauvegardes 3-2-1", sim: 'backup',

function simRedund(el) {
  let arch = 'single', fault = 'none';
  const ARCH = { single: "Sans redondance", links: "Liens doublés", dual: "Routeurs doublés" };
  const FAULT = { none: "Aucune panne", cable: "Câble coupé", router: "Routeur R1 en panne", switch: "Switch en panne" };
  const EXTRA = {
    single: "Matériel en plus : aucun. Une seule chaîne PC, switch, routeur, Internet.",
    links: "Matériel en plus : un câble entre le switch et R1.",
    dual: "Matériel en plus : un routeur R2 et deux câbles. Le coût augmente."
  };
  function message(ok, viaR2) {
    if (fault === 'none') return arch === 'single' ? "Tout fonctionne, mais chaque élément de la chaîne est un point unique de défaillance." : arch === 'links' ? "Tout fonctionne. Le second câble ne sert que si le premier tombe." : "Tout fonctionne. R2 reste en secours et prend le relais si R1 tombe.";
    if (fault === 'cable') return arch === 'single' ? "Le câble est coupé et il n'y a pas d'autre chemin : le PC perd Internet." : arch === 'links' ? "Un câble est coupé, mais le second prend le relais : personne ne s'en aperçoit." : "Le lien vers R1 est coupé : le trafic passe par R2.";
    if (fault === 'router') return arch === 'dual' ? "R1 est en panne : R2 prend le relais." : arch === 'links' ? "R1 est en panne et il est seul : tout s'arrête. Doubler le câble ne suffisait pas, il fallait doubler le routeur." : "R1 est en panne et il est seul : tout s'arrête.";
    return "Le switch est en panne : il reste un point unique de défaillance dans les trois architectures. Il faut aussi le doubler, avec des liens redondants entre switchs gérés par STP.";
  }
  function draw() {
    const dual = arch === 'dual', links2 = arch === 'links';
    const swUp = fault !== 'switch', r1Up = fault !== 'router', cut = fault === 'cable';
    const viaR1 = swUp && r1Up && (!cut || links2);
    const viaR2 = swUp && dual && !viaR1;
    const ok = viaR1 || viaR2;
    const PC = [50, 125], SW = [150, 125], NET = [420, 125], R1 = dual ? [290, 62] : [290, 125], R2 = [290, 188];
    let l = '', n = '', mark = '';

    n += nodeSVG(R1[0], R1[1], 'R1', r1Up ? '' : 'en panne', r1Up ? (viaR1 ? 'on' : '') : 'fail', 70, 40);
    if (dual) n += nodeSVG(R2[0], R2[1], 'R2', viaR2 ? 'relais' : 'secours', viaR2 ? 'on' : '', 70, 40);

    el.innerHTML = `<div class="sim">

  el.addEventListener('click', e => {

/* ---------- Simulation : STP, trois switchs en triangle ---------- */
function simStp(el) {
  let mode = 'stp', cut = -1, low = 'none';
  const NAMES = ['SW1', 'SW2', 'SW3'];
  const POS = { SW1: [240, 48], SW2: [95, 190], SW3: [385, 190] };
  const MACN = { SW1: 1, SW2: 2, SW3: 3 };
  const LINKS = [['SW1', 'SW2'], ['SW1', 'SW3'], ['SW2', 'SW3']];
  const CUTS = ["Aucune panne", "Lien SW1–SW2 coupé", "Lien SW1–SW3 coupé", "Lien SW2–SW3 coupé"];
  const cmpArr = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; };
  const bid = n => [n === low ? 4096 : 32768, MACN[n]];
  function compute(c) {
    let root = NAMES[0];
    NAMES.forEach(n => { if (cmpArr(bid(n), bid(root)) < 0) root = n; });
    const cost = {}; NAMES.forEach(n => { cost[n] = n === root ? 0 : 99; });
    for (let k = 0; k < 3; k++) LINKS.forEach((lk, i) => {
      if (i === c) return;
      const a = lk[0], b = lk[1];
      if (cost[a] + 4 < cost[b]) cost[b] = cost[a] + 4;
      if (cost[b] + 4 < cost[a]) cost[a] = cost[b] + 4;
    });
    const rp = {};
    NAMES.forEach(n => {
      if (n === root) return;
      let bi = -1, bk = null;
      LINKS.forEach((lk, i) => {
        if (i === c || lk.indexOf(n) < 0) return;
        const m = lk[0] === n ? lk[1] : lk[0];
        const key = [cost[m] + 4, bid(m)[0], bid(m)[1], i];
        if (bk === null || cmpArr(key, bk) < 0) { bk = key; bi = i; }
      });
      rp[n] = bi;
    });
    const ports = LINKS.map((lk, i) => {
      if (i === c) return null;
      const a = lk[0], b = lk[1];
      const desig = cmpArr([cost[a], bid(a)[0], bid(a)[1]], [cost[b], bid(b)[0], bid(b)[1]]) < 0 ? a : b;
      const st = {};
      lk.forEach(n => { st[n] = rp[n] === i ? 'root' : (n === desig ? 'designated' : 'blocked'); });
      return st;
    });
    return { root, cost, rp, ports };
  }
  function draw() {
    const st = compute(cut), base = compute(-1);
    let l = '', mk = '', n = '', loop = '';
    LINKS.forEach((lk, i) => {
      const A = POS[lk[0]], B = POS[lk[1]];
      let c;
      if (i === cut) c = 'fail';
      else if (mode === 'nostp') c = cut === -1 ? 'waste' : 'out';
      else c = (st.ports[i][lk[0]] === 'blocked' || st.ports[i][lk[1]] === 'blocked') ? 'blk' : 'req';
      l += lineSVG(A[0], A[1], B[0], B[1], c);
      if (i === cut) l += `<text x="${(A[0] + B[0]) / 2}" y="${(A[1] + B[1]) / 2 + 6}" text-anchor="middle" style="fill:var(--bad);font-size:18px">✕</text>`;
      if (mode === 'stp' && i !== cut) lk.forEach((nm, e) => {
        const P = POS[nm], Q = POS[lk[1 - e]], dx = Q[0] - P[0], dy = Q[1] - P[1], len = Math.sqrt(dx * dx + dy * dy);
        const x = (P[0] + dx / len * 70).toFixed(1), y = (P[1] + dy / len * 70).toFixed(1), s = st.ports[i][nm];
        mk += `<g class="mk ${s === 'root' ? 'ok' : s === 'blocked' ? 'd2' : 'd1'}"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${(+y + 4).toFixed(1)}" text-anchor="middle">${s === 'root' ? 'R' : s === 'blocked' ? 'B' : 'D'}</text></g>`;
      });
    });
    if (mode === 'nostp' && cut === -1) {
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const path = `M${POS.SW1} L${POS.SW3} L${POS.SW2} Z`;
      if (reduce) NAMES.forEach(nm => { loop += `<circle cx="${POS[nm][0]}" cy="${POS[nm][1]}" r="6" style="fill:var(--d2)"/>`; });
      else [0, -0.8, -1.6].forEach(b => { loop += `<circle r="6" style="fill:var(--d2)"><animateMotion dur="2.4s" begin="${b}s" repeatCount="indefinite" path="${path}"/></circle>`; });
    }
    NAMES.forEach(nm => {
      const P = POS[nm], isRoot = mode === 'stp' && nm === st.root;
      n += nodeSVG(P[0], P[1], nm, `${nm === low ? 4096 : 32768} · :0${MACN[nm]}`, isRoot ? 'on' : '', 100, 46);
      if (isRoot) n += `<text x="${P[0]}" y="${nm === 'SW1' ? P[1] - 32 : P[1] + 40}" text-anchor="middle" style="fill:var(--ok);font-size:12px;font-weight:700">RACINE</text>`;
    });
    let info = '';
    if (mode === 'nostp') {
      info = cut === -1
        ? `<div class="fb bad"><b>Tempête de diffusion.</b><p>Les trois liens sont actifs : c'est une boucle. Une trame de diffusion est recopiée par chaque switch, tourne sans fin et se multiplie. En quelques secondes, le réseau est saturé.</p></div>`
        : `<div class="fb ok"><b>Pas de boucle, mais pas de secours.</b><p>Un lien est coupé : les switchs forment une ligne. Le réseau fonctionne, mais une deuxième panne le coupera en deux. Activez STP pour avoir la redondance sans la boucle.</p></div>`;
    } else {
      const log = [];
      log.push(low === 'none' ? `Élection : toutes les priorités valent 32768, donc la plus petite adresse MAC gagne. ${st.root} devient le pont racine.` : `Élection : ${low} a la priorité la plus basse (4096). Il devient le pont racine.`);
      NAMES.forEach(nm => {
        if (nm === st.root) return;
        const lk = LINKS[st.rp[nm]], other = lk[0] === nm ? lk[1] : lk[0];
        log.push(`${nm} : port racine (R) vers ${other}, coût total vers la racine : ${st.cost[nm]}.`);
      });
      LINKS.forEach((lk, i) => {
        if (i === cut) return;
        lk.forEach(nm => { if (st.ports[i][nm] === 'blocked') log.push(`Lien ${lk[0]}–${lk[1]} : le port de ${nm} est bloqué (B). Il évite la boucle et reste prêt en secours.`); });
      });
      if (cut >= 0) {
        const cl = LINKS[cut], was = base.ports[cut];
        const wasBlocked = was[cl[0]] === 'blocked' || was[cl[1]] === 'blocked';
        log.push(wasBlocked
          ? `Le lien coupé ${cl[0]}–${cl[1]} était justement le lien bloqué : personne ne s'en aperçoit.`
          : `Le lien ${cl[0]}–${cl[1]} est coupé. STP recalcule l'arbre et réactive le port qui était bloqué : Blocking, Listening, Learning, puis Forwarding. Comptez 30 à 50 s en STP classique, 1 à 2 s en RSTP.`);
      }
      info = `<ol class="log">${log.map(x => `<li>${x}</li>`).join('')}</ol>`;
    }
    el.innerHTML = `<div class="sim">
      <div class="seg" role="group" aria-label="Mode"><button data-s="mode" data-v="nostp" aria-pressed="${mode === 'nostp'}">Sans STP</button><button data-s="mode" data-v="stp" aria-pressed="${mode === 'stp'}">Avec STP</button></div>
      <svg class="map" viewBox="0 0 480 250" role="img" aria-label="Trois switchs en triangle">${l}${loop}${mk}${n}</svg>
      <div class="leg"><span><b style="color:var(--ok)">R</b> port racine</span><span><b style="color:var(--accent)">D</b> port désigné</span><span><b style="color:var(--d2)">B</b> port bloqué</span><span>Sous chaque nom : priorité · fin de l'adresse MAC</span></div>
      <div class="seg" role="group" aria-label="Panne">${CUTS.map((t, i) => `<button data-s="cut" data-v="${i - 1}" aria-pressed="${cut === i - 1}">${t}</button>`).join('')}</div>
      <div class="fl"><div class="field"><label for="stp-low">Priorité 4096 pour</label><select id="stp-low"><option value="none"${low === 'none' ? ' selected' : ''}>Personne (32768 partout)</option>${NAMES.map(x => `<option value="${x}"${low === x ? ' selected' : ''}>${x}</option>`).join('')}</select></div></div>
      ${info}</div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'mode') mode = b.dataset.v; else cut = +b.dataset.v;
    draw();
  });
  el.addEventListener('change', e => { if (e.target.id === 'stp-low') { low = e.target.value; draw(); } });
  draw();
}

/* ---------- Simulation : VRRP, bascule Master et Backup ---------- */
function simVrrp(el) {
  let step = 0, pre = true;
  const TITLES = ["1. Fonctionnement normal", "2. R1 tombe en panne", "3. R2 devient Master", "4. R1 revient"];
  function roles() {
    if (step === 0) return { r1: 'master', r2: 'backup', act: 'r1' };
    if (step === 1) return { r1: 'down', r2: 'wait', act: null };
    if (step === 2) return { r1: 'down', r2: 'master', act: 'r2' };
    return pre ? { r1: 'master', r2: 'backup', act: 'r1' } : { r1: 'backup', r2: 'master', act: 'r2' };
  }
  const LAB = { master: "Master", backup: "Backup", down: "en panne", wait: "attend…" };
  const CLS = { master: 'on', backup: 'd1', down: 'fail', wait: 'd1' };
  function body() {
    if (step === 0) return "R1 (priorité 110) est Master : il possède l'IP virtuelle et répond aux PC. Il envoie une annonce VRRP chaque seconde vers 224.0.0.18. R2 (priorité 100) est Backup : il écoute et ne route rien.";
    if (step === 1) return "Plus aucune annonce n'arrive. R2 attend, puis déclare R1 perdu après environ 3 secondes (3 annonces manquées). Pendant ce court délai, les paquets des PC vers 192.168.1.1 restent sans réponse.";
    if (step === 2) return "R2 prend l'IP virtuelle et la MAC virtuelle, puis envoie un ARP gratuit pour que le switch apprenne son port. Les PC n'ont rien changé : même passerelle, même MAC dans leur table ARP.";
    return pre
      ? "R1 revient avec la priorité 110, supérieure à 100 : il reprend le rôle de Master (préemption activée). R2 repasse Backup. Une courte perturbation est possible pendant le retour."
      : "R1 revient, mais R2 reste Master tant qu'il fonctionne : R1 devient Backup (préemption désactivée). On évite un deuxième basculement, mais le routeur préféré n'est plus Master.";
  }
  function ann() {
    if (step === 0) return "Annonces : R1 envoie (priorité 110) toutes les secondes · R2 reçoit";
    if (step === 1) return "Annonces : aucune depuis 3 s · R2 lance l'élection";
    if (step === 2) return "Annonces : R2 envoie (priorité 100) · R1 est éteint";
    return pre ? "Annonces : R1 envoie (priorité 110) · R2 reçoit et repasse Backup" : "Annonces : R2 envoie (priorité 100) · R1 reçoit et reste Backup";
  }
  function draw() {
    const r = roles();
    const PC = [55, 125], SW = [150, 125], R1 = [290, 58], R2 = [290, 192], NET = [425, 125];
    const c1 = r.act === 'r1' ? 'out' : r.r1 === 'down' ? 'fail' : '';
    const c2 = r.act === 'r2' ? 'out' : r.r2 === 'down' ? 'fail' : '';
    let l = lineSVG(PC[0], PC[1], SW[0], SW[1], r.act ? 'out' : 'waste');
    l += lineSVG(SW[0], SW[1], R1[0], R1[1], c1) + lineSVG(R1[0], R1[1], NET[0], NET[1], c1);
    l += lineSVG(SW[0], SW[1], R2[0], R2[1], c2) + lineSVG(R2[0], R2[1], NET[0], NET[1], c2);
    const sub = (role, p) => role === 'down' ? LAB[role] : `${LAB[role]} · ${p}`;
    let n = nodeSVG(PC[0], PC[1], 'PC', '', r.act ? 'on' : 'waste', 56, 34);
    n += nodeSVG(SW[0], SW[1], 'SW', '', r.act ? 'on' : '', 64, 40);
    n += nodeSVG(R1[0], R1[1], 'R1', sub(r.r1, 110), CLS[r.r1], 100, 44);
    n += nodeSVG(R2[0], R2[1], 'R2', sub(r.r2, 100), CLS[r.r2], 100, 44);
    n += nodeSVG(NET[0], NET[1], 'Internet', '', r.act ? 'on' : '', 76, 34);
    n += `<text class="sub" x="${PC[0]}" y="${PC[1] + 30}" text-anchor="middle">GW 192.168.1.1</text>`;
    el.innerHTML = `<div class="sim">
      <div class="step">Étape ${step + 1} sur 4</div>
      <svg class="map" viewBox="0 0 480 250" role="img" aria-label="${TITLES[step]}">${l}${n}</svg>
      ${legend([['--ok', "Chemin des paquets"], ['--bad', "Routeur en panne"], ['--d2', "Paquets sans réponse"]])}
      <div class="note"><b>${TITLES[step]}</b><br>${body()}</div>
      <div class="pkt"><span>${ann()}</span><span>Table ARP du PC : <b>192.168.1.1</b> = <b>00:00:5E:00:01:01</b> (MAC virtuelle, inchangée)</span></div>
      <div class="seg" role="group" aria-label="Préemption"><button data-s="pre" data-v="1" aria-pressed="${pre}">Préemption activée</button><button data-s="pre" data-v="0" aria-pressed="${!pre}">Préemption désactivée</button></div>
      <div><button class="btn" data-s="next">${step < 3 ? "Étape suivante" : "Recommencer"}</button></div></div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'next') step = step < 3 ? step + 1 : 0;
    else pre = b.dataset.v === '1';
    draw();
  });
  draw();
}

/* --- Remettre des étapes dans l'ordre (cycle de veille, réponse à incident) --- */
function simOrder(el, t) {
  const R = t.order; let pool, done, err, msg;
  function reset() { pool = shuffle(R.map((x, i) => i)); done = []; err = 0; msg = ''; draw(); }
  function draw() {
    const fin = done.length === R.length;
    let h = `<div class="sim"><div class="eyebrow">${fin ? 'Terminé' : `Étape ${done.length + 1} sur ${R.length}`}</div>
      <ol class="ord-done">${done.map(i => `<li><span class="ord-n">${i + 1}</span>${esc(R[i])}</li>`).join('')}${fin ? '' : `<li class="ord-next"><span class="ord-n">${done.length + 1}</span>Quelle est l'étape suivante ?</li>`}</ol>`;
    if (!fin) h += `<div class="opts">${pool.filter(i => done.indexOf(i) < 0).map(i => `<button class="opt" data-s="o" data-i="${i}"><span class="l">›</span><span>${esc(R[i])}</span></button>`).join('')}</div>`;
    if (msg) h += msg;
    if (fin) h += `<div class="fb ${err ? 'bad' : 'ok'}"><b>${err ? err + ' erreur' + (err > 1 ? 's' : '') + ' en route' : 'Sans faute !'}</b><p>${err ? 'Relis l\'ordre ci-dessus, puis recommence pour le faire sans erreur.' : 'Tu maîtrises l\'enchaînement des étapes.'}</p></div><div><button class="btn" data-s="again">Recommencer</button></div>`;
    el.innerHTML = h + `</div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'again') return reset();
    const i = +b.dataset.i;
    if (i === done.length) { done.push(i); msg = ''; }
    else { err++; msg = `<div class="fb bad"><b>Pas encore.</b><p>« ${esc(R[i])} » vient plus tard. Quelle étape doit logiquement venir avant ?</p></div>`; }
    draw();
  });
  reset();
}

/* --- Matrice des risques --- */
function simRisk(el) {
  const SC = [
    ['Ransomware, serveur sans sauvegarde', 3, 4], ['Panne du seul switch de cœur', 2, 4], ['Vol d\'un PC portable chiffré', 2, 2],
    ['Clé Wi-Fi invités publiée', 4, 1], ['Phishing sur la messagerie', 4, 3], ['Inondation de la salle serveur', 1, 4]];
  let p = 3, im = 4, sc = 0;
  const lvl = r => r >= 9 ? ['Prioritaire', 'bad', 'Traiter tout de suite : réduire le risque (contre-mesure) ou le transférer.'] : r >= 5 ? ['À surveiller', 'mid', 'Planifier une contre-mesure dans les prochains mois.'] : ['Acceptable', 'ok', 'Accepter en le documentant, et le réévaluer régulièrement.'];
  function draw() {
    const r = p * im, L = lvl(r);

    for (let pp = 4; pp >= 1; pp--) { g += `<tr><th>${pp}</th>`; for (let ii = 1; ii <= 4; ii++) { const v = pp * ii; g += `<td class="rk-${lvl(v)[1]}${pp === p && ii === im ? ' on' : ''}">${v}</td>`; } g += `</tr>`; }

    el.innerHTML = `<div class="sim"><div class="field"><label>Scénario</label><div class="seg">${SC.map((s, i) => `<button data-s="sc" data-i="${i}" aria-pressed="${sc === i}">${esc(s[0])}</button>`).join('')}</div></div>
      <div class="fl"><div class="field"><label>Probabilité</label><div class="seg">${[1, 2, 3, 4].map(v => `<button data-s="p" data-v="${v}" aria-pressed="${p === v}">${v}</button>`).join('')}</div></div>
      <div class="field"><label>Impact</label><div class="seg">${[1, 2, 3, 4].map(v => `<button data-s="i" data-v="${v}" aria-pressed="${im === v}">${v}</button>`).join('')}</div></div></div>
      <div class="rk-wrap">${g}<div class="stats2"><div><b>${r}</b><span>${p} × ${im} = niveau de risque</span></div><div><b class="rk-t ${L[1]}">${L[0]}</b><span>sur une échelle de 1 à 16</span></div></div></div>
      <div class="note">${L[2]}</div></div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;

    if (s === 'sc') { sc = +b.dataset.i; p = SC[sc][1]; im = SC[sc][2]; }
    else if (s === 'p') { p = +b.dataset.v; sc = -1; } else if (s === 'i') { im = +b.dataset.v; sc = -1; }
    draw();
  });
  draw();
}

/* --- Hachage SHA-256 et effet avalanche --- */
function sha256hex(str) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str)), l = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < bytes.length; o += 64) {
    const w = [];
    for (let i = 0; i < 64; i++) {
      if (i < 16) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
      else { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = H.map((x, i) => (x + [a, b, c, d, e, f, g, h][i]) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

/* --- ACL pas à pas --- */
function simAcl(el) {

  const match = (ip, net, wc) => { const a = ip2n(ip), n = ip2n(net), w = ip2n(wc); return ((a ^ n) & ~w & 0xFFFFFFFF) >>> 0 === 0 || ((a | w) >>> 0) === ((n | w) >>> 0); };
  const ACLS = [
    { n: "ACL 110 · stagiaires → serveur web (étendue)", L: [

      ['permit', 'tcp', '192.168.10.0', '0.0.0.255', '10.0.0.10', '0.0.0.0', 443],
      ['deny', 'ip', '192.168.10.0', '0.0.0.255', '10.0.0.10', '0.0.0.0', null],
      ['permit', 'ip', '0.0.0.0', '255.255.255.255', '0.0.0.0', '255.255.255.255', null]] },
    { n: "ACL 120 · seulement web et DNS (oubli du permit final)", L: [
      ['permit', 'tcp', '192.168.10.0', '0.0.0.255', '0.0.0.0', '255.255.255.255', 443],
      ['permit', 'udp', '192.168.10.0', '0.0.0.255', '0.0.0.0', '255.255.255.255', 53]] },
    { n: "ACL 10 · bloquer le poste 192.168.10.66 (standard)", std: true, L: [
      ['deny', 'ip', '192.168.10.66', '0.0.0.0', '0.0.0.0', '255.255.255.255', null],
      ['permit', 'ip', '0.0.0.0', '255.255.255.255', '0.0.0.0', '255.255.255.255', null]] }
  ];
  const PK = [['Web HTTPS', 'tcp', 443], ['Web HTTP', 'tcp', 80], ['DNS', 'udp', 53], ['Ping', 'icmp', null], ['SSH', 'tcp', 22]];
  const SRC = ['192.168.10.25', '192.168.10.66', '192.168.20.7'], DST = ['10.0.0.10', '8.8.8.8'];

  const txt = (l, std) => std ? `${l[0]} ${host(l[2], l[3])}` : `${l[0]} ${l[1]} ${host(l[2], l[3])} ${host(l[4], l[5])}${l[6] ? ' eq ' + l[6] : ''}`;
  function hit(l) {

/* --- Sauvegardes : quoi restaurer ? --- */
function simBackup(el) {
  const D = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  let type = 'inc', fail = 4;
  function draw() {
    const need = []; if (type === 'full') need.push(fail - 1); else if (type === 'diff') { need.push(0); if (fail - 1 > 0) need.push(fail - 1); } else for (let i = 0; i < fail; i++) need.push(i);
    const lab = i => i === 0 ? 'Complète' : type === 'full' ? 'Complète' : type === 'inc' ? 'Incrémentale' : 'Différentielle';
    const vol = i => i === 0 || type === 'full' ? 100 : type === 'inc' ? 10 : 10 * i;
    const tl = D.map((d, i) => i < fail ? `<div class="bk${need.indexOf(i) >= 0 ? ' need' : ''}"><b>${d}</b><span>${lab(i)}</span><small>${vol(i)} Go</small>${need.indexOf(i) >= 0 ? `<em>#${need.indexOf(i) + 1}</em>` : ''}</div>` : i === fail ? `<div class="bk crash"><b>${d}</b><span>💥 panne</span></div>` : `<div class="bk off"><b>${d}</b></div>`).join('');
    const stored = D.slice(0, fail).reduce((s, d, i) => s + vol(i), 0);
    el.innerHTML = `<div class="sim"><div class="field"><label>Sauvegarde quotidienne (complète le dimanche)</label><div class="seg">
      <button data-s="t" data-v="full" aria-pressed="${type === 'full'}">Complète chaque jour</button><button data-s="t" data-v="inc" aria-pressed="${type === 'inc'}">Incrémentale</button><button data-s="t" data-v="diff" aria-pressed="${type === 'diff'}">Différentielle</button></div></div>
      <div class="field"><label>Jour de la panne</label><div class="seg">${D.slice(1).map((d, i) => `<button data-s="f" data-v="${i + 1}" aria-pressed="${fail === i + 1}">${d}</button>`).join('')}</div></div>

      <div class="stats2"><div><b>${need.length}</b><span>sauvegarde${need.length > 1 ? 's' : ''} à restaurer, dans l'ordre</span></div><div><b>${stored} Go</b><span>stockés depuis dimanche</span></div></div>
      <div class="note">${type === 'inc' ? "Incrémentale : rapide et légère chaque jour, mais il faut restaurer la complète puis <b>toutes</b> les incrémentales. Si une seule manque, la restauration est incomplète." : type === 'diff' ? "Différentielle : elle grossit chaque jour, mais la restauration est simple : la complète + la <b>dernière</b> différentielle." : "Complète chaque jour : restauration la plus simple (une seule sauvegarde), mais la plus lourde en stockage et en temps."}</div></div>`;

}

/* ---------- Simulations : routage ---------- */
const rtN = s => s.split('.').reduce((a, b) => a * 256 + (+b), 0);
const rtIn = (ip, net, len) => len === 0 || Math.floor(rtN(ip) / Math.pow(2, 32 - len)) === Math.floor(rtN(net) / Math.pow(2, 32 - len));
const rtBin = (ip, len) => ip.split('.').map(o => (+o).toString(2).padStart(8, '0')).join('').split('').map((c, i) => (i < len ? `<b>${c}</b>` : c) + (i % 8 === 7 && i < 31 ? '.' : '')).join('');

/* --- Routage statique : aller, retour et ping --- */
function simStatic(el) {
  const R = {
    R1: { c: [['192.168.1.0', 24, 'G0/0'], ['10.0.12.0', 30, 'S0/0']], ip: ['192.168.1.1', '10.0.12.1'] },
    R2: { c: [['10.0.12.0', 30, 'S0/0'], ['10.0.23.0', 30, 'S0/1'], ['192.168.2.0', 24, 'G0/0']], ip: ['10.0.12.2', '10.0.23.1', '192.168.2.1'] },
    R3: { c: [['10.0.23.0', 30, 'S0/1'], ['192.168.3.0', 24, 'G0/0']], ip: ['10.0.23.2', '192.168.3.1'] }
  };
  const NH = { '10.0.12.1': 'R1', '10.0.12.2': 'R2', '10.0.23.1': 'R2', '10.0.23.2': 'R3' };
  const C = [
    ['R1', '192.168.3.0', 24, '10.0.12.2'], ['R1', '192.168.2.0', 24, '10.0.12.2'], ['R1', '0.0.0.0', 0, '10.0.12.2'], ['R1', '192.168.3.0', 24, '10.0.23.2'],
    ['R2', '192.168.3.0', 24, '10.0.23.2'], ['R2', '192.168.1.0', 24, '10.0.12.1'],
    ['R3', '192.168.1.0', 24, '10.0.23.1'], ['R3', '192.168.2.0', 24, '10.0.23.1'], ['R3', '0.0.0.0', 0, '10.0.23.1']
  ];
  const PCS = { PC1: ['192.168.1.10', 'R1'], PC2: ['192.168.2.10', 'R2'], PC3: ['192.168.3.10', 'R3'] };
  const mask = l => [0, 1, 2, 3].map(i => { const b = Math.max(0, Math.min(8, l - i * 8)); return 256 - Math.pow(2, 8 - b); }).join('.');
  let on = {}, src = 'PC1', dst = 'PC3', res = null;
  const valid = c => R[c[0]].c.some(n => rtIn(c[3], n[0], n[1]));
  function route(r, ip) {
    let best = null;
    R[r].c.forEach(n => { if (rtIn(ip, n[0], n[1]) && (!best || n[1] > best.l)) best = { l: n[1], t: 'C', n: n[0], out: n[2], hop: null }; });
    C.forEach((c, i) => { if (on[i] && c[0] === r && valid(c) && rtIn(ip, c[1], c[2]) && (!best || c[2] > best.l)) best = { l: c[2], t: c[2] ? 'S' : 'S*', n: c[1], hop: c[3] }; });
    return best;
  }
  function trip(from, to) {
    const ip = PCS[to][0]; let r = PCS[from][1]; const L = []; let ttl = 6;
    while (ttl--) {
      const b = route(r, ip);
      if (!b) { L.push(['bad', `${r} : aucune route vers ${ip} → paquet détruit (destination inaccessible)`]); return [false, L]; }
      if (b.t === 'C') { L.push(['ok', `${r} : ${ip} est dans le réseau connecté ${b.n}/${b.l} (${b.out}) → livré à ${to}`]); return [true, L]; }
      L.push(['', `${r} : route ${b.t} ${b.n}/${b.l} via ${b.hop} → envoyé à ${NH[b.hop]}`]); r = NH[b.hop];
    }
    L.push(['bad', 'Boucle de routage : TTL épuisé']); return [false, L];
  }
  function draw() {
    const rows = ['R1', 'R2', 'R3'].map(r => `<div class="st-r"><h4>${r}</h4><p class="muted">Connectés : ${R[r].c.map(n => n[0] + '/' + n[1]).join(', ')}</p>${C.map((c, i) => c[0] !== r ? '' : `<button class="st-c${on[i] ? ' on' : ''}${on[i] && !valid(c) ? ' inv' : ''}" data-s="c" data-i="${i}"><span>${on[i] ? '☑' : '☐'}</span><code>ip route ${c[1]} ${mask(c[2])} ${c[3]}</code>${on[i] && !valid(c) ? '<em>next-hop non joignable : route non installée</em>' : ''}</button>`).join('')}</div>`).join('');
    let out = '';
    if (res) {
      out = `<div class="block"><h3>Aller ${src} → ${dst}</h3><ol class="trc">${res.a[1].map(l => `<li class="${l[0]}">${esc(l[1])}</li>`).join('')}</ol></div>`;
      if (res.a[0]) out += `<div class="block"><h3>Retour ${dst} → ${src} (la réponse)</h3><ol class="trc">${res.r[1].map(l => `<li class="${l[0]}">${esc(l[1])}</li>`).join('')}</ol></div>`;
      const ok = res.a[0] && res.r[0];
      out += `<div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? 'Ping réussi : Reply from ' + PCS[dst][0] : res.a[0] ? 'Ping échoué : la requête arrive, mais la réponse ne revient pas' : 'Ping échoué : la requête n\'arrive pas'}</b><p>${ok ? 'Il existe une route à l\'aller ET au retour sur chaque routeur traversé.' : res.a[0] ? 'Il manque une route retour vers le réseau de ' + src + '. C\'est l\'oubli le plus fréquent.' : 'Ajoute la route manquante sur le routeur indiqué en rouge.'}</p></div>`;
    }
    el.innerHTML = `<div class="sim"><svg viewBox="0 0 640 120" class="map"><g class="link"><line x1="60" y1="60" x2="170" y2="60"/><line x1="230" y1="60" x2="290" y2="60"/><line x1="350" y1="60" x2="410" y2="60"/><line x1="470" y1="60" x2="580" y2="60"/><line x1="320" y1="80" x2="320" y2="100"/></g>
      <g class="n"><rect x="20" y="42" width="60" height="36" rx="6"/><text x="50" y="65" text-anchor="middle">PC1</text><rect x="170" y="42" width="60" height="36" rx="6"/><text x="200" y="65" text-anchor="middle">R1</text><rect x="290" y="42" width="60" height="36" rx="6"/><text x="320" y="65" text-anchor="middle">R2</text><rect x="410" y="42" width="60" height="36" rx="6"/><text x="440" y="65" text-anchor="middle">R3</text><rect x="560" y="42" width="60" height="36" rx="6"/><text x="590" y="65" text-anchor="middle">PC3</text><rect x="295" y="96" width="50" height="22" rx="5"/><text x="320" y="112" text-anchor="middle" class="sub">PC2</text></g>
      <text x="115" y="30" text-anchor="middle" class="sub">192.168.1.0/24</text><text x="260" y="30" text-anchor="middle" class="sub">10.0.12.0/30</text><text x="380" y="30" text-anchor="middle" class="sub">10.0.23.0/30</text><text x="525" y="30" text-anchor="middle" class="sub">192.168.3.0/24</text><text x="400" y="112" class="sub">192.168.2.0/24</text></svg>
      <div class="st-grid">${rows}</div>
      <div class="fl"><div class="field"><label>Ping depuis</label><div class="seg">${Object.keys(PCS).map(p => `<button data-s="src" data-v="${p}" aria-pressed="${src === p}">${p}</button>`).join('')}</div></div><div class="field"><label>Vers</label><div class="seg">${Object.keys(PCS).map(p => `<button data-s="dst" data-v="${p}" aria-pressed="${dst === p}">${p}</button>`).join('')}</div></div></div>
      <div class="actions"><button class="btn" data-s="ping">Lancer le ping</button><button class="btn alt" data-s="reset">Tout effacer</button></div>${out}</div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return; const s = b.dataset.s;
    if (s === 'c') on[b.dataset.i] = !on[b.dataset.i];
    else if (s === 'src') src = b.dataset.v; else if (s === 'dst') dst = b.dataset.v;
    else if (s === 'reset') on = {};
    if (s === 'ping' && src !== dst) res = { a: trip(src, dst), r: trip(dst, src) }; else if (s !== 'ping') res = null;
    draw();
  });
  draw();
}

/* --- Statique, RIP ou OSPF : quel chemin ? --- */
function simDyn(el) {
  const LK = { a: ['R1', 'R4', 10, 'Lien direct 10 Mbit/s'], b: ['R1', 'R2', 1000, 'R1–R2 1 Gbit/s'], c: ['R2', 'R3', 1000, 'R2–R3 1 Gbit/s'], d: ['R3', 'R4', 1000, 'R3–R4 1 Gbit/s'] };
  const P = [{ n: 'Direct (R1 → R4)', l: ['a'] }, { n: 'Fibre (R1 → R2 → R3 → R4)', l: ['b', 'c', 'd'] }];
  let proto = 'rip', down = {};
  const cost = k => Math.max(1, Math.round(10000 / LK[k][2]));
  function draw() {
    const up = p => p.l.every(k => !down[k]);
    const hops = p => p.l.length, pc = p => p.l.reduce((s, k) => s + cost(k), 0);
    let ch = null;
    if (proto === 'static') ch = up(P[0]) ? P[0] : null;
    else { const c = P.filter(up); if (c.length) ch = c.reduce((a, b) => (proto === 'rip' ? hops(a) <= hops(b) : pc(a) <= pc(b)) ? a : b); }
    const used = k => ch && ch.l.indexOf(k) >= 0;
    const ln = (k, x1, y1, x2, y2) => `<line class="link ${down[k] ? 'blk' : used(k) ? 'out' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke-width:${used(k) ? 5 : 3}"/><text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 8}" text-anchor="middle" class="sub">${LK[k][2] >= 1000 ? '1 Gb/s' : '10 Mb/s'} · coût ${cost(k)}</text>`;
    const msg = proto === 'static' ? (ch ? "La route statique de R1 pointe vers R4 par le lien direct. Elle est configurée à la main : elle ne regarde ni le débit ni l'état des autres chemins." : "Le lien direct est coupé, mais la route statique ne change pas toute seule : le trafic est perdu tant qu'un administrateur n'intervient pas (ou qu'une route flottante n'existe pas).")
      : proto === 'rip' ? (ch ? `RIP compte les sauts : ${ch.n} = ${hops(ch)} saut${hops(ch) > 1 ? 's' : ''}. ${ch === P[0] ? "Il choisit le lien à 10 Mbit/s, 100 fois plus lent que la fibre !" : "Le lien direct étant coupé, RIP a convergé vers la fibre."}` : 'Plus aucun chemin : réseau inaccessible.')
      : (ch ? `OSPF additionne les coûts (référence 10 Gbit/s) : ${P.map(p => p.n.split(' (')[0] + ' = ' + (up(p) ? pc(p) : '∞')).join(' ; ')}. Il choisit le plus petit coût.` : 'Plus aucun chemin : réseau inaccessible.');
    el.innerHTML = `<div class="sim"><div class="field"><label>Type de routage sur R1</label><div class="seg"><button data-s="p" data-v="static" aria-pressed="${proto === 'static'}">Route statique</button><button data-s="p" data-v="rip" aria-pressed="${proto === 'rip'}">RIP (sauts)</button><button data-s="p" data-v="ospf" aria-pressed="${proto === 'ospf'}">OSPF (coût)</button></div></div>
      <svg viewBox="0 0 600 230" class="map">${ln('a', 120, 60, 480, 60)}${ln('b', 80, 60, 180, 180)}${ln('c', 180, 180, 420, 180)}${ln('d', 420, 180, 520, 60)}
      <g class="n"><rect x="40" y="42" width="80" height="36" rx="6"/><text x="80" y="65" text-anchor="middle">R1</text><rect x="480" y="42" width="80" height="36" rx="6"/><text x="520" y="65" text-anchor="middle">R4</text><rect x="140" y="162" width="80" height="36" rx="6"/><text x="180" y="185" text-anchor="middle">R2</text><rect x="380" y="162" width="80" height="36" rx="6"/><text x="420" y="185" text-anchor="middle">R3</text></g>
      <text x="80" y="30" text-anchor="middle" class="sub">LAN source</text><text x="520" y="30" text-anchor="middle" class="sub">LAN destination</text></svg>
      <div class="field"><label>Couper / rétablir un lien</label><div class="seg">${Object.keys(LK).map(k => `<button data-s="l" data-k="${k}" aria-pressed="${!!down[k]}">${down[k] ? '✂ ' : ''}${LK[k][3]}</button>`).join('')}</div></div>
      <div class="scroll"><table><thead><tr><th>Chemin</th><th>Sauts (RIP)</th><th>Coût (OSPF)</th><th>État</th></tr></thead><tbody>${P.map(p => `<tr class="${ch === p ? 'rt-best' : ''}"><td>${p.n}</td><td>${hops(p)}</td><td>${pc(p)}</td><td>${up(p) ? (ch === p ? '✔ utilisé' : 'disponible') : '✂ coupé'}</td></tr>`).join('')}</tbody></table></div>
      <div class="fb ${ch ? 'ok' : 'bad'}"><b>${ch ? 'Chemin choisi : ' + ch.n : 'Destination inaccessible'}</b><p>${msg}</p></div></div>`;
  }
  el.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; if (b.dataset.s === 'p') proto = b.dataset.v; else down[b.dataset.k] = !down[b.dataset.k]; draw(); });
  draw();
}
