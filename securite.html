<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sécurité informatique — Cours complet · Infrastructure Digitale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,600;0,700;1,400;1,600&display=swap">
<style>
:root{
  --navy:#1B2A4A; --navy2:#2C3E66; --teal:#0F766E; --teal-l:#E6F4F1;
  --gold:#B8913A; --gold-l:#FBF4E4; --rose:#A84A62; --rose-l:#FBEEF1;
  --violet:#5B4B8A; --violet-l:#F1EEF8; --sky:#2F6FA8; --sky-l:#EAF2FA;
  --ink:#24292F; --muted:#5E6673; --line:#E3DED3; --cream:#FBF9F4;
}



*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Inter,"DejaVu Sans",sans-serif;font-size:10.2pt;line-height:1.58;color:var(--ink);margin:0}
h1,h2,h3,h4{font-family:Lora,Georgia,serif;color:var(--navy);line-height:1.25}
h2{font-size:17pt;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold);break-after:avoid}
h2 .n{color:var(--gold);margin-right:8px}
h3{font-size:12.5pt;margin:18px 0 6px;color:var(--teal);break-after:avoid}
h4{font-size:11pt;margin:12px 0 4px;break-after:avoid}
p{margin:6px 0 8px;text-align:justify}
ul,ol{margin:4px 0 10px;padding-left:20px} li{margin:2px 0}
strong{color:var(--navy)}

  background:linear-gradient(155deg,#16223D 0%,#1B2A4A 45%,#0F4F5C 100%);color:#fff}


/* KEYWORDS */
.k{padding:1px 7px;border-radius:4px;font-weight:600;font-size:.94em;white-space:nowrap}
.kb{background:var(--sky-l);color:var(--sky)} .kt{background:var(--teal-l);color:var(--teal)}
.kg{background:var(--gold-l);color:#8A6A22} .kr{background:var(--rose-l);color:var(--rose)}
.kv{background:var(--violet-l);color:var(--violet)}

/* BOXES */
.box{border-radius:10px;padding:11px 15px 9px 15px;margin:12px 0;;border-left:5px solid}
.box .t{font-weight:700;font-size:8.6pt;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.box .t i{font-style:normal;display:inline-flex;width:18px;height:18px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-size:10pt}
.box p{margin:3px 0}
.def{background:var(--sky-l);border-color:var(--sky)} .def .t{color:var(--sky)} .def .t i{background:var(--sky)}
.tip{background:var(--teal-l);border-color:var(--teal)} .tip .t{color:var(--teal)} .tip .t i{background:var(--teal)}
.warn{background:var(--rose-l);border-color:var(--rose)} .warn .t{color:var(--rose)} .warn .t i{background:var(--rose)}
.keep{background:var(--gold-l);border-color:var(--gold)} .keep .t{color:#8A6A22} .keep .t i{background:var(--gold)}
.ana{background:var(--violet-l);border-color:var(--violet)} .ana .t{color:var(--violet)} .ana .t i{background:var(--violet)}
.kwbox{border:1px dashed #CFC6B0;border-radius:10px;padding:9px 13px;margin:12px 0;background:#fff;}
.kwbox .t{font-size:8.5pt;letter-spacing:1.6px;font-weight:700;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.kwbox .k{display:inline-block;margin:2px 3px}

/* TABLES */
table{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0 14px;font-size:9.2pt;border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;font-weight:600;font-size:8.8pt}
td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--cream)}
tr{}
td b{color:var(--navy)}
.cap{font-size:8.5pt;color:var(--muted);text-align:center;font-style:italic;margin:-6px 0 12px}

/* FIGURES */
figure{margin:12px 0 14px;text-align:center;}
figure svg{max-width:100%;height:auto}
figcaption{font-size:8.5pt;color:var(--muted);font-style:italic;margin-top:4px}

/* EXERCISES */
.exo{border:1px solid var(--line);border-radius:10px;margin:12px 0;;overflow:hidden}
.exo .h{background:var(--navy);color:#fff;padding:6px 14px;font-size:9.3pt;font-weight:600;display:flex;justify-content:space-between}
.exo .h span{color:#D9BD7A;font-weight:400}
.exo .c{padding:8px 15px 6px}
.cor{border:1px solid #CFE5DF;border-radius:10px;margin:10px 0;;overflow:hidden}
.cor .h{background:var(--teal);color:#fff;padding:6px 14px;font-size:9.3pt;font-weight:600}
.cor .c{padding:8px 15px 6px;background:#FAFDFC}
.lines{border-bottom:1px dotted #bbb;height:18px}

.section-intro{font-family:Lora;font-style:italic;color:var(--navy2);font-size:11pt}

.toc .row{display:flex;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.toc .row .nb{font-family:Lora;font-size:17pt;color:var(--gold);width:48px}
.toc .row .tt{flex:1;font-family:Lora;font-size:12.5pt;color:var(--navy)}
.toc .row .ds{font-size:8.8pt;color:var(--muted);display:block;font-family:Inter}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;}
.card h4{margin:0 0 4px;font-size:10.5pt}
.card p{font-size:9.2pt;margin:0;text-align:left}
.pb{break-before:page}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
/* ===== Version web ===== */
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(184,145,58,.10),transparent 60%),#F6F3EC;background-attachment:fixed;font-size:16px;line-height:1.65}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 80px}
p{text-align:left}
section.toc,.page{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(27,42,74,.06),0 8px 26px rgba(27,42,74,.07);padding:clamp(18px,4vw,36px);margin:26px 0}
/* topnav */
.topnav{position:sticky;top:0;z-index:20;background:rgba(22,34,61,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(217,189,122,.25);box-shadow:0 4px 20px rgba(11,18,34,.18)}
.tn-in{max-width:1100px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px}
.tn-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.tn-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 14px Lora,serif;color:#16223D;background:linear-gradient(135deg,#E2C78A,#B8913A)}
.tn-name{font:600 1.05rem Lora,serif;white-space:nowrap}.tn-name em{color:#D9BD7A}
.tn-mods{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tn-mod{border:1px solid rgba(255,255,255,.18);color:#D6DEEC;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem;white-space:nowrap;text-decoration:none}
.tn-mod:hover{border-color:#D9BD7A;color:#fff}
.tn-mod[aria-current="page"]{background:linear-gradient(135deg,#D9BD7A,#B8913A);border-color:transparent;color:#16223D}
/* hero */
.hero{position:relative;overflow:hidden;margin:26px 0;border-radius:22px;padding:clamp(26px,6vw,56px);color:#fff;background:linear-gradient(155deg,#16223D 0%,#1B2A4A 45%,#0F4F5C 100%);box-shadow:0 10px 30px rgba(11,18,34,.2)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(217,189,122,.3);pointer-events:none}
.hero::before{width:420px;height:420px;right:-150px;top:-160px}.hero::after{width:260px;height:260px;right:-60px;top:-80px}
.hero .tag{font-size:.78rem;letter-spacing:4px;color:#D9BD7A;text-transform:uppercase}
.hero h1{font-family:Lora,serif;font-size:clamp(2.3rem,8vw,3.8rem);color:#fff;margin:12px 0 4px;line-height:1.05}
.hero h1 em{color:#D9BD7A}.hero h1 br{display:none}
.hero .bar{width:60px;height:3px;background:#D9BD7A;margin:18px 0}
.hero .sub{font-size:1.08rem;color:#C9D4E5;max-width:620px;font-weight:300}
.hero .chips{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.hero .chips span{border:1px solid rgba(217,189,122,.6);color:#EBDDB5;padding:4px 12px;border-radius:20px;font-size:.8rem}
.hero .meta{margin-top:22px;font-size:.88rem;color:#AFC0D8;line-height:1.8}.hero .meta b{color:#fff}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 24px;min-height:48px;font-weight:700;text-decoration:none;border:0}
.btn.gold{background:linear-gradient(135deg,#C9A24E,#A57F2C);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn.ghostw{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.3)}
/* sommaire */
.toc .row{text-decoration:none;color:inherit;border-radius:10px;padding:10px 8px;transition:background .15s}
.toc .row:hover{background:var(--cream)}.toc .row:hover .tt{color:var(--teal)}
/* chapter head */
.chead2{display:grid;grid-template-columns:150px 1fr;border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--line);margin:56px 0 22px;box-shadow:0 1px 2px rgba(27,42,74,.06),0 8px 26px rgba(27,42,74,.07)}
.ch-side{display:flex;flex-direction:column;justify-content:center;padding:20px;color:#fff}
.ch-side .lbl{font-size:.72rem;letter-spacing:4px;opacity:.85}
.ch-side .num{font:700 4.4rem/1 Lora,serif}
.ch-body{padding:24px 28px}
.ch-body h1{font-size:clamp(1.6rem,4.6vw,2.2rem);margin:0 0 8px}
.ch-body .lead{font-family:Lora,serif;font-style:italic;color:var(--muted);font-size:1.05rem}
.ch-body .obj{margin-top:16px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.ch-body .obj h4{margin:0 0 4px;font-family:Inter;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.ch-body .quote{margin-top:16px;font-family:Lora,serif;font-style:italic;color:var(--navy2);border-left:3px solid var(--gold);padding-left:14px}
/* contenus */
h2{scroll-margin-top:80px}
figure svg{width:100%;height:auto;max-width:680px}
.tscroll{overflow-x:auto;margin:10px 0 16px;border-radius:10px}
.tscroll table{margin:0;min-width:520px}
details.cor{border:1px solid #CFE5DF;border-radius:12px;margin:10px 0;overflow:hidden;background:#fff}
details.cor>summary{background:var(--teal);color:#fff;padding:9px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.cor>summary::-webkit-details-marker{display:none}
details.cor>summary::after{content:"Voir le corrigé ▾";font-weight:400;font-size:.85rem;opacity:.85}
details.cor[open]>summary::after{content:"Masquer ▴"}
details.cor .c{padding:10px 16px;background:#FAFDFC}
.exo,.box,.kwbox,.card{background-clip:padding-box}
.fab{position:fixed;right:18px;bottom:18px;z-index:15;background:var(--navy);color:#D9BD7A;border-radius:999px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 8px 22px rgba(11,18,34,.3);font-size:.9rem}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}
.foot a{color:var(--teal);font-weight:600}
@media (max-width:640px){
  .tn-in{flex-direction:column;align-items:stretch;gap:8px}.tn-mods{margin-left:0}.tn-mods{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.tn-mod{white-space:normal;padding:8px 6px;font-size:.8rem;line-height:1.2;text-align:center}
  .chead2{grid-template-columns:1fr}.ch-side{flex-direction:row;align-items:baseline;gap:12px;padding:14px 20px}.ch-side .num{font-size:2.6rem}
  .ch-body{padding:18px}
  .grid2,.grid3{grid-template-columns:1fr}
  .hero::after{display:none}
  .toc .row .nb{width:38px;font-size:15pt}
  body{font-size:15.5px}
}
@media print{.topnav,.fab,.hero-actions{display:none}}

.chead2#tp .ch-side .num{font-size:3.4rem}
details.cor pre{margin:6px 0}
